name: Daily Brief Update

on:
  schedule:
    - cron: '0 0 * * 0-5'     # 6:00 AM BDT (UTC+6) — Sun–Fri (skip Saturday)
  workflow_dispatch:           # Also allows manual trigger from GitHub UI

concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install "anthropic>=0.84"
          npm ci

      - name: Ingest market data into Supabase
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest.py

      - name: Run update script
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY:             ${{ secrets.BREVO_API_KEY }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          FROM_EMAIL:                ${{ secrets.FROM_EMAIL }}
        run: python update.py

      - name: Build production HTML
        run: bash build.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: |
            the-brief.html
            index.html
            gathered_data.json
          retention-days: 7

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add the-brief.html index.html sw.js
          git diff --staged --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push
