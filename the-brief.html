<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>THE BRIEF — Bangladesh Business Intelligence</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none';" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Brief" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script>
    (function(){
      try {
        var d = localStorage.getItem('the-brief-dark');
        if (d === null) d = 'false';
        document.documentElement.classList.toggle('light', d === 'false');
      } catch(e) {}
    })();
  </script>
  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"></script>
  <style>
    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --border:    #1e2329;
      --border2:   #2a3040;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #3b82f6;
      --accent2:   #1d4ed8;
      --bull:      #22c55e;
      --bear:      #ef4444;
      --warn:      #f59e0b;
      --neutral:   #94a3b8;
      --tag-bg:    #1e2329;
      --pill-bear: rgba(239,68,68,0.12);
      --pill-bull: rgba(34,197,94,0.12);
      --pill-warn: rgba(245,158,11,0.12);
      --pill-neu:  rgba(148,163,184,0.1);
      --brand-color: #ffffff;
    }

    :root.light {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --border2:   #cbd5e1;
      --text:      #1e293b;
      --muted:     #64748b;
      --accent:    #2563eb;
      --accent2:   #1d4ed8;
      --bull:      #16a34a;
      --bear:      #dc2626;
      --warn:      #d97706;
      --neutral:   #475569;
      --tag-bg:    #f1f5f9;
      --pill-bear: rgba(220,38,38,0.08);
      --pill-bull: rgba(22,163,74,0.08);
      --pill-warn: rgba(217,119,6,0.08);
      --pill-neu:  rgba(71,85,105,0.08);
      --brand-color: #0f172a;
    }

    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow-x: clip;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 20px 32px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {}
    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--brand-color);
      text-transform: uppercase;
    }
    .brand span { color: var(--accent); }

    .tagline {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      text-align: right;
    }
    .date-stamp {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: var(--bull);
      font-size: 9px;
      letter-spacing: 0.15em;
      padding: 2px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .live-dot {
      width: 5px; height: 5px;
      background: var(--bull);
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Nav Bar ── */
    .nav {
      display: flex; gap: 0; padding: 0;
      background: var(--bg); border-bottom: 1px solid var(--border);
      overflow: visible;
      position: fixed; top: 80px; left: 0; right: 0; z-index: 99;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-group { position: relative; flex: 1; }
    .nav-group-btn {
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 10px 16px; cursor: pointer;
      white-space: nowrap; border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      display: flex; align-items: center; gap: 4px;
      width: 100%; justify-content: center;
    }
    .nav-group-btn:hover { color: var(--text); }
    .nav-group-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .nav-chevron { font-size: 7px; transition: transform .2s; }
    .nav-group-btn.open .nav-chevron { transform: rotate(180deg); }
    .nav-dropdown {
      position: absolute; top: 100%; left: 0; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border); border-top: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 101;
      padding: 4px 0;
      opacity: 0; transform: translateY(-4px); pointer-events: none;
      transition: opacity .15s, transform .15s;
    }
    .nav-dropdown.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .nav-drop-item {
      display: block; width: 100%; background: none; border: none;
      color: var(--muted); font-family: inherit; font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer; text-align: left;
      white-space: nowrap; transition: color .15s, background .15s;
    }
    .nav-drop-item:hover { color: var(--text); background: var(--border); }
    .nav-drop-item.active { color: var(--accent); background: rgba(59,130,246,0.08); }

    /* ── Main layout ── */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px;
      padding-top: 68px;
    }

    /* ── Section ── */
    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-num {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--muted);
      background: var(--tag-bg);
      padding: 2px 7px;
      border-radius: 2px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }
    .section-icon {
      font-size: 14px;
      margin-left: auto;
    }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .cards-grid-3 {
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }

    /* News headline cards */
    .headline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .headline-card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; transition: border-color .2s; text-decoration: none; color: inherit; }
    .headline-card:hover { border-color: var(--border2); }
    .headline-title { font-size: 11.5px; font-weight: 600; line-height: 1.5; color: var(--text); margin-bottom: 6px; }
    .headline-meta { font-size: 9px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .headline-source-tag { font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .oped-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-top: 16px; }
    .oped-card { display: block; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 14px 16px; text-decoration: none; color: inherit; }
    .oped-card:hover { border-color: var(--border2); }
    .oped-title { font-size: 12px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; color: var(--text); }
    .oped-author { font-size: 10px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
    .oped-summary { font-size: 11px; color: var(--text); line-height: 1.6; margin-bottom: 8px; }
    .oped-meta { font-size: 9px; color: var(--muted); }
    .subsection-label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 20px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      position: relative;
      transition: border-color .2s;
    }
    .card:hover { border-color: var(--border2); }

    .card-accent-bull { border-left: 3px solid var(--bull); }
    .card-accent-bear { border-left: 3px solid var(--bear); }
    .card-accent-warn { border-left: 3px solid var(--warn); }
    .card-accent-neu  { border-left: 3px solid var(--neutral); }
    .card-accent-blue { border-left: 3px solid var(--accent); }

    .card-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand-color);
      line-height: 1.2;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color .15s, background .15s, border-color .15s;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--border2); }

    /* ── Subscribe button ── */
    .subscribe-btn {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--accent);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      transition: background .15s, border-color .15s;
    }
    .subscribe-btn:hover { background: rgba(59,130,246,0.2); border-color: var(--accent); }

    /* ── Subscribe modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      width: 340px;
      padding: 24px 24px 20px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: none; border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 2px;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }
    .modal-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 18px;
    }
    .form-group { margin-bottom: 13px; }
    .form-label {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .form-label .req { color: var(--accent); margin-left: 2px; }
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 2px;
      transition: border-color .15s;
    }
    .form-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }
    .form-input::placeholder { color: var(--muted); opacity: 0.55; }
    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .submit-btn:disabled { background: var(--border2); color: var(--muted); cursor: not-allowed; opacity: 0.55; }
    .submit-btn:not(:disabled):hover { background: var(--accent2); }

    .card-value-sm { font-size: 18px; }

    .card-change {
      font-size: 11px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .bull { color: var(--bull); }
    .bear { color: var(--bear); }
    .warn { color: var(--warn); }
    .neu  { color: var(--neutral); }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── Pill tags ── */
    .pill {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 2px;
      font-weight: 600;
    }
    .pill-bull { background: var(--pill-bull); color: var(--bull); border: 1px solid rgba(34,197,94,0.25); }
    .pill-bear { background: var(--pill-bear); color: var(--bear); border: 1px solid rgba(239,68,68,0.25); }
    .pill-warn { background: var(--pill-warn); color: var(--warn); border: 1px solid rgba(245,158,11,0.25); }
    .pill-neu  { background: var(--pill-neu);  color: var(--neutral); border: 1px solid rgba(148,163,184,0.2); }
    .pill-blue { background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.25); }

    /* ── News items ── */
    .news-list { display: flex; flex-direction: column; gap: 8px; }
    .news-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .news-item:hover { border-color: var(--border2); }
    .news-bullet {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .news-content {}
    .news-headline {
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .news-source {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .news-source a {
      color: var(--accent);
      text-decoration: none;
    }
    .news-source a:hover { text-decoration: underline; }
    .news-time {
      font-size: 9px;
      color: var(--muted);
    }

    /* ── Ticker strip ── */
    .ticker-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .ticker-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ticker-name {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .ticker-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    .ticker-chg { font-size: 10px; }

    /* ── Table ── */
    .brief-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .brief-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      background: var(--surface);
    }
    .brief-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .brief-table tr:last-child td { border-bottom: none; }
    .brief-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* ── Two-col layout ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px; }
      .header { padding: 16px; }
      .nav-group-btn { padding: 10px 4px; font-size: 8px; letter-spacing: 0.04em; }
      .nav-dropdown { min-width: 140px; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .ticker-strip { font-size: 11px; }
    }

    /* ── Context box ── */
    .context-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }
    .context-box strong { color: var(--text); }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text);
      opacity: 0.6;
      letter-spacing: 0.08em;
    }
    .footer a {
      color: var(--text);
      text-decoration: none;
    }
    .footer a:hover { color: var(--accent); opacity: 1; }
    @media (max-width: 768px) {
      .footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
        padding: 16px 20px calc(80px + env(safe-area-inset-bottom, 0px));
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Signal bar ── */
    .signal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .signal-label { font-size: 10px; color: var(--muted); min-width: 80px; }
    .signal-bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .signal-bar-fill { height: 100%; border-radius: 2px; }
    .signal-val { font-size: 10px; font-weight: 700; min-width: 50px; text-align: right; }

function Sparkline({ data, color }) {
  const w = 80, h = 24, pad = 2;
  const vals = data.map(Number);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <div className="sparkline-wrap">
      <svg width={w} height={h} style={{ overflow: "visible" }}>
        <polyline points={pts} fill="none" stroke={color || "var(--accent)"} strokeWidth="1.5"
          strokeLinejoin="round" strokeLinecap="round" />
        <circle cx={pts.split(" ").slice(-1)[0].split(",")[0]}
                cy={pts.split(" ").slice(-1)[0].split(",")[1]}
                r="2.5" fill={color || "var(--accent)"} />
      </svg>
    </div>
  );
}

// ── Shared Chart Hover Hook ──────────────────────────────────────────────────
function useChartHover(dataLength, cx) {
  const [hovered, setHovered] = React.useState(null);
  const handleMouseMove = React.useCallback((e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const W = parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
    const mouseX = (e.clientX - rect.left) / rect.width * W;
    let closest = 0, closestDist = Infinity;
    for (let i = 0; i < dataLength; i++) {
      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  }, [dataLength, cx]);
  const handleMouseLeave = React.useCallback(() => setHovered(null), []);
  return { hovered, handleMouseMove, handleMouseLeave };
}

const YieldCurveChart = React.memo(function YieldCurveChart() {
  const W = 680, H = 240;
  const pad = { top: 36, right: 50, bottom: 44, left: 52 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const fallback = {
    maturities: ["3M", "6M", "1Y", "2Y", "5Y", "10Y", "15Y", "20Y"],
    yields:     [9.85, 10.11, 10.07, 9.77, 9.00, 10.32, 10.37, 10.47],
  };
  const yc = useSupabaseChart(fallback, async () => {
    const { data: latest, error: e1 } = await _sb
      .from("tb_yield_curve")
      .select("snapshot_date")
      .order("snapshot_date", { ascending: false })
      .limit(1);
    if (e1 || !latest || latest.length === 0) return null;
    const snapshotDate = latest[0].snapshot_date;
    const { data: rows, error: e2 } = await _sb
      .from("tb_yield_curve")
      .select("tenor, tenor_months, yield_pct")
      .eq("snapshot_date", snapshotDate)
      .order("tenor_months", { ascending: true });
    if (e2 || !rows || rows.length === 0) return null;
    return {
      maturities: rows.map((r) => r.tenor),
      yields:     rows.map((r) => parseFloat(r.yield_pct)),
    };

  const maturities = yc.maturities;
  const yields     = yc.yields;
  const n = maturities.length;

  const yMin = 8.6, yMax = 10.8;
  const cx = i => pad.left + (i / (n - 1)) * iW;
  const cy = v => pad.top + ((yMax - v) / (yMax - yMin)) * iH;
  const pts = yields.map((v, i) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(" ");

    ` L ${cx(n - 1).toFixed(1)},${cy(yMin).toFixed(1)} L ${cx(0).toFixed(1)},${cy(yMin).toFixed(1)} Z`;

          </g>
        ))}

        <line x1={pad.left} y1={policyY} x2={W - pad.right} y2={policyY}
          stroke="rgba(234,179,8,0.6)" strokeWidth="1.5" strokeDasharray="6,3" />
        <text x={W - pad.right - 4} y={policyY - 4} fill="var(--warn)" fontSize="9" textAnchor="end" fontWeight="600">Policy 10%</text>

        {yields.map((v, i) => (
          <g key={i}>
            <circle cx={cx(i)} cy={cy(v)} r={hovered === i ? 6 : 3.5} fill="var(--accent)" stroke="var(--surface)" strokeWidth="1.5" />
            <text x={cx(i)} y={cy(v) - 8} fill="var(--fg)" fontSize="9" textAnchor="middle" fontWeight="600">{v.toFixed(2)}%</text>

        <text x={cx(5)} y={cy(yields[5]) + 16} fill="var(--bear)" fontSize="8" textAnchor="middle" fontWeight="600">10Y {yields[5].toFixed(2)}%</text>

        {maturities.map((m, i) => (

        {hovered !== null && (<>

const LNGChart = React.memo(function LNGChart() {
  // JKM LNG spot from Supabase tb_lng_jkm_weekly. Fallback = inline array.
  const data = useSupabaseChart(LNG_CHART_DATA, async () => {
    const { data: rows, error } = await _sb
      .from("tb_lng_jkm_weekly")
      .select("week_start, label, price_usd_mmbtu")
      .order("week_start", { ascending: true });
    if (error || !rows || rows.length === 0) return null;
    return rows.map((r, i, arr) => ({
      label: r.label,
      value: parseFloat(r.price_usd_mmbtu),
      today: i === arr.length - 1,
    }));
  });

  const W = 720, H = 250;
  const pad = { top: 40, right: 58, bottom: 80, left: 54 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const vals   = data.map(d => d.value);
  const minV   = Math.floor((Math.min(...vals) - 1) / 2) * 2;
  const maxV   = Math.ceil ((Math.max(...vals) + 1) / 2) * 2;

  const cx = i => pad.left + (i / (data.length - 1)) * iW;
  const cy = v => pad.top  + ((maxV - v) / (maxV - minV)) * iH;

  const linePoints = data.map((d, i) => `${cx(i).toFixed(1)},${cy(d.value).toFixed(1)}`).join(" ");
  const areaPoints = `${cx(0).toFixed(1)},${(H-pad.bottom).toFixed(1)} ${linePoints} ${cx(data.length-1).toFixed(1)},${(H-pad.bottom).toFixed(1)}`;

  const gridVals = [];
  for (let v = minV + 2; v < maxV; v += 2) gridVals.push(v);

  const lastIdx = data.length - 1;
  const lastVal = data[lastIdx].value;

  const { hovered, handleMouseMove, handleMouseLeave } = useChartHover(data.length, cx);

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4, padding: "12px 0 0" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }}
        onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}
        role="img" aria-label="Asian LNG spot price (JKM) trend">
        <title>Asian LNG spot price (JKM) trend</title>

        {/* Y-axis title */}
        <text x={0} y={0} fill="var(--muted)" fontSize="9.5" textAnchor="middle"
          transform={`translate(13,${(pad.top + (H - pad.bottom)) / 2}) rotate(-90)`}>Asian LNG Spot $/MMBtu</text>

        {/* Grid lines */}
        {gridVals.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={cy(v)} x2={W - pad.right} y2={cy(v)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3" />
            <text x={pad.left - 6} y={cy(v) + 4} fill="var(--muted)" fontSize="10" textAnchor="end">${v}</text>
          </g>
        ))}

        {/* Area fill */}
        <polygon points={areaPoints} fill="rgba(239,68,68,0.07)" />

        {/* Price line */}
        <polyline points={linePoints} fill="none" stroke="var(--bear)" strokeWidth="2.5" strokeLinejoin="round" />

        {/* Today label */}
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 12} fill="var(--bear)" fontSize="10" textAnchor="start" fontWeight="700">${lastVal.toFixed(1)}</text>
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 1}  fill="var(--bear)" fontSize="9"  textAnchor="start">TODAY</text>

        {/* Dots */}
        {data.map((d, i) => {
          const isToday = i === lastIdx;
          return (
            <circle key={i} cx={cx(i)} cy={cy(d.value)}
              r={hovered === i ? 6 : (isToday ? 4.5 : 2.5)}
              fill="var(--bear)"
              stroke="var(--surface)" strokeWidth="1.5" />
          );
        })}

        {/* X-axis labels */}
        {data.map((d, i) => (
          <text key={i} x={cx(i)} y={H - pad.bottom + 16}
            fill={i === lastIdx ? "var(--bear)" : "var(--muted)"}
            fontSize="9" textAnchor="middle">{d.label}</text>
        ))}

        {/* Hover crosshair + tooltip */}
        {hovered !== null && (<>
          <line x1={cx(hovered)} y1={pad.top} x2={cx(hovered)} y2={H - pad.bottom}
            stroke="var(--muted)" strokeWidth="1" strokeDasharray="4,3" opacity="0.6" />
          <foreignObject
            x={Math.min(cx(hovered) + 10, W - 160)} y={Math.max(cy(data[hovered].value) - 48, pad.top)}
            width="150" height="50" style={{ pointerEvents: "none" }}>
            <div xmlns="http://www.w3.org/1999/xhtml" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "6px 10px", fontSize: 11, boxShadow: "0 2px 8px rgba(0,0,0,0.12)", pointerEvents: "none", color: "var(--text)" }}>
              <strong>{data[hovered].label}</strong><br/>
              ${data[hovered].value.toFixed(1)}/MMBtu
            </div>
          </foreignObject>
        </>)}

      </svg>

      {/* Legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "10px 20px", padding: "4px 16px 12px", fontSize: 10, color: "var(--muted)", alignItems: "center" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ display: "inline-block", width: 20, height: 2.5, background: "var(--bear)", borderRadius: 1 }} />
          Asian LNG Spot ($/MMBtu)
        </span>
        <span style={{ marginLeft: "auto" }}>Source: Platts JKM / ICIS · Estimates</span>
      </div>
    </div>
  );
});

function App() {
  const [activeSection, setActiveSection] = useState("bb");
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('the-brief-dark') === 'true'; } catch(e) { return false; }
  });
  const toggleDark = () => setDark(prev => {
    const next = !prev;
    try { localStorage.setItem('the-brief-dark', String(next)); } catch(e) {}
    return next;
  });
  const [openGroup, setOpenGroup] = useState(null);

  // ── Subscribe modal state ─────────────────────────────────────────────────
  const [showSubscribe, setShowSubscribe] = useState(false);
  const [subName,       setSubName]       = useState("");
  const [subOrg,        setSubOrg]        = useState("");
  const [subEmail,      setSubEmail]      = useState("");
  const [subSubmitted,  setSubSubmitted]  = useState(false);
  const [subLoading,    setSubLoading]    = useState(false);
  const [subError,      setSubError]      = useState("");
  const canSubmit = subName.trim().length > 0 && subEmail.trim().length > 0 && !subLoading;

  async function handleSubscribe(e) {
    e.preventDefault();
    setSubLoading(true);
    setSubError("");
    const { error } = await _sb.from("subscribers").insert({
      name:         subName.trim(),
      organisation: subOrg.trim() || null,
      email:        subEmail.trim().toLowerCase(),
    });
    setSubLoading(false);
    if (error) {
      if (error.code === "23505") { setSubSubmitted(true); return; }
      setSubError("Something went wrong. Please try again.");
      return;
    }
    setSubSubmitted(true);
  }

  function closeModal() {
    setShowSubscribe(false);
    if (subSubmitted) {
      setSubName(""); setSubOrg(""); setSubEmail(""); setSubSubmitted(false);
    }
    setSubError("");
  }

  // ── Custom bottom-nav slots (persisted in localStorage) ───────────────────
  const [customSlots, setCustomSlots] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem("tb-custom-slots")) || ["remit","banking"]; }
    catch { return ["remit","banking"]; }
  });
  const [editingSlot, setEditingSlot] = React.useState(null);
  const lpTimer = React.useRef(null);

  const NAV_ICON = {
    bb:"🏦", macro:"📊", dse:"📈", tbond:"📜", comm:"🌾", dam:"🛒",
    fx:"💱", remit:"💸", banking:"🏛️", tariff:"🇺🇸", trade:"🚢",
    iranwar:"🛢️", rmg:"👕", fiscal:"💰", nbr:"🧾", power:"⚡", peers:"🌏"
  };

  function startLP(idx) {
    lpTimer.current = setTimeout(() => setEditingSlot(idx), 500);
  }
  function cancelLP() { clearTimeout(lpTimer.current); }

  function pickSlot(sectionId) {
    const next = [...customSlots];
    next[editingSlot] = sectionId;
    setCustomSlots(next);
    try { localStorage.setItem("tb-custom-slots", JSON.stringify(next)); } catch {}
    setEditingSlot(null);
  }

  useEffect(() => {
    document.documentElement.classList.toggle("light", !dark);
  }, [dark]);

  // ── Subscribe modal: Escape to close + focus trap ─────────────────────────
  useEffect(() => {
    if (!showSubscribe) return;
    const prevFocus = document.activeElement;
    function onKey(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeModal();
        return;
      }
      if (e.key !== "Tab") return;
      const overlay = document.querySelector('.modal-overlay');
      if (!overlay) return;
      const focusables = Array.from(overlay.querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'
      ));
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last  = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      if (prevFocus && typeof prevFocus.focus === "function") {
        try { prevFocus.focus(); } catch {}
      }
    };
  }, [showSubscribe]);

  useEffect(() => {
    function positionNav() {
      const hdr = document.querySelector('.header');
      const nav = document.querySelector('.nav');
      const main = document.querySelector('.main');
      if (!hdr || !nav || !main) return;
      const hh = hdr.offsetHeight;
      const nh = nav.offsetHeight;
      nav.style.top = hh + 'px';
      main.style.paddingTop = (hh + nh + 4) + 'px';
    }
    positionNav();
    window.addEventListener('resize', positionNav);
    return () => window.removeEventListener('resize', positionNav);
  }, []);

  function scrollTo(id) {
    setActiveSection(id);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }

  useEffect(() => {
    function onScroll() {
      const ids = SECTIONS.map(s => s.id);
      for (let i = ids.length - 1; i >= 0; i--) {
        const el = document.getElementById(ids[i]);
        if (el && el.getBoundingClientRect().top <= 140) {
          setActiveSection(ids[i]);
          return;
        }
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // ── Close nav dropdown on click outside ──
  useEffect(() => {
    if (!openGroup) return;
    function handleClickOutside(e) {
      if (!e.target.closest('.nav-group')) setOpenGroup(null);
    }
    document.addEventListener('mousedown', handleClickOutside);
    document.addEventListener('touchstart', handleClickOutside);
    return () => {
      document.removeEventListener('mousedown', handleClickOutside);
      document.removeEventListener('touchstart', handleClickOutside);
    };
  }, [openGroup]);

  return (
    <div>

      <header className="header">
        <div className="header-left">
          <h1 className="brand" style={{ margin: 0 }}>THE <span>BRIEF</span></h1>

            <button className="subscribe-btn" onClick={() => setShowSubscribe(true)}>
              ✉ Subscribe
            </button>
            <button className="theme-toggle" onClick={toggleDark} aria-label={dark ? "Switch to light mode" : "Switch to dark mode"}>
              {dark ? "☀ Light" : "☾ Dark"}
            </button>
          </div>
        </div>
      </header>

      {/* Nav */}
      <nav className="nav">
        {NAV_GROUPS.map(g => {
          const isActiveGroup = g.ids.includes(activeSection);
          const isOpen = openGroup === g.key;
          return (
            <div key={g.key} className="nav-group">
              <button
                className={`nav-group-btn${isActiveGroup ? " active" : ""}${isOpen ? " open" : ""}`}
                onClick={() => setOpenGroup(isOpen ? null : g.key)}
                aria-expanded={isOpen}
                aria-haspopup="true"
              >
                {g.label}
                <span className="nav-chevron">&#9662;</span>
              </button>
              <div className={`nav-dropdown${isOpen ? " visible" : ""}`}>
                {g.ids.map(id => {
                  const sec = SECTIONS.find(s => s.id === id);
                  if (!sec) return null;
                  return (
                    <button key={id}
                      className={`nav-drop-item${activeSection === id ? " active" : ""}`}
                      onClick={() => { scrollTo(id); setOpenGroup(null); }}
                    >{sec.label}</button>
                  );
                })}

            </div>
          );
        })}
      </nav>

      {/* Body */}
      <main className="main" id="main-content">
        <SectionExec />
        <hr className="divider" />
        <SectionHeadlines />
        <hr className="divider" />
        <SectionBB />
        <hr className="divider" />
        <SectionBanking />
        <hr className="divider" />
        <SectionDSE />
        <hr className="divider" />
        <SectionTBond />

        <hr className="divider" />

        <SectionComm />

          { id: "dse",     icon: "📈", label: "DSE" },
          { id: "iranwar", icon: "🛢️", label: "Iran/Oil" },
        ].map(s => (
          <button key={s.id}
            className={`bottom-nav-btn ${activeSection === s.id ? "active" : ""}`}

            <span className="bottom-nav-icon">{s.icon}</span>
            {s.label}
          </button>

        {customSlots.map((sid, idx) => {
          const sec = SECTIONS.find(s => s.id === sid);
          if (!sec) return null;
          return (
            <button key={idx}

            {subSubmitted ? (
              <div style={{ textAlign: "center", padding: "16px 0 8px" }}>
                <div style={{ fontSize: 32, color: "var(--bull)", marginBottom: 10 }}>✓</div>
                <div className="modal-title">You're on the list</div>
                <div className="modal-sub" style={{ marginTop: 6, marginBottom: 0 }}>
                  We'll send THE BRIEF to {subEmail} every morning.
                </div>
              </div>
            ) : (
              <>
                <div className="modal-title">Subscribe to THE BRIEF</div>
                <div className="modal-sub">Daily Bangladesh business intelligence, delivered to your inbox.</div>
                <form onSubmit={handleSubscribe}>
                  <div className="form-group">
                    <label className="form-label">Name <span className="req">*</span></label>
                    <input className="form-input" type="text" placeholder="Your name"
                      value={subName} onChange={e => setSubName(e.target.value)} autoFocus />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Organisation</label>
                    <input className="form-input" type="text" placeholder="Company / institution (optional)"
                      value={subOrg} onChange={e => setSubOrg(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Email Address <span className="req">*</span></label>
                    <input className="form-input" type="email" placeholder="you@example.com"
                      value={subEmail} onChange={e => setSubEmail(e.target.value)} />
                  </div>
                  <button className="submit-btn" type="submit" disabled={!canSubmit}>
                    {subLoading ? "Sending…" : "Subscribe →"}
                  </button>
                  {subError && (
                    <div style={{ color: "var(--bear)", fontSize: 10, letterSpacing: "0.05em", marginTop: 8, textAlign: "center" }}>
                      {subError}
                    </div>
                  )}
                </form>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
