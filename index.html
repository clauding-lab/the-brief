<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE BRIEF — Bangladesh Business Intelligence</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Brief" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --border:    #1e2329;
      --border2:   #2a3040;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #3b82f6;
      --accent2:   #1d4ed8;
      --bull:      #22c55e;
      --bear:      #ef4444;
      --warn:      #f59e0b;
      --neutral:   #94a3b8;
      --tag-bg:    #1e2329;
      --pill-bear: rgba(239,68,68,0.12);
      --pill-bull: rgba(34,197,94,0.12);
      --pill-warn: rgba(245,158,11,0.12);
      --pill-neu:  rgba(148,163,184,0.1);
      --brand-color: #ffffff;
    }

    :root.light {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --border2:   #cbd5e1;
      --text:      #1e293b;
      --muted:     #64748b;
      --accent:    #2563eb;
      --accent2:   #1d4ed8;
      --bull:      #16a34a;
      --bear:      #dc2626;
      --warn:      #d97706;
      --neutral:   #475569;
      --tag-bg:    #f1f5f9;
      --pill-bear: rgba(220,38,38,0.08);
      --pill-bull: rgba(22,163,74,0.08);
      --pill-warn: rgba(217,119,6,0.08);
      --pill-neu:  rgba(71,85,105,0.08);
      --brand-color: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 20px 32px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {}
    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--brand-color);
      text-transform: uppercase;
    }
    .brand span { color: var(--accent); }

    .tagline {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      text-align: right;
    }
    .date-stamp {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: var(--bull);
      font-size: 9px;
      letter-spacing: 0.15em;
      padding: 2px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .live-dot {
      width: 5px; height: 5px;
      background: var(--bull);
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Nav Bar ── */
    .nav {
      display: flex; gap: 0; padding: 0;
      background: var(--bg); border-bottom: 1px solid var(--border);
      overflow: visible;
      position: fixed; top: 80px; left: 0; right: 0; z-index: 99;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-group { position: relative; flex: 1; }
    .nav-group-btn {
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 10px 16px; cursor: pointer;
      white-space: nowrap; border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      display: flex; align-items: center; gap: 4px;
      width: 100%; justify-content: center;
    }
    .nav-group-btn:hover { color: var(--text); }
    .nav-group-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .nav-chevron { font-size: 7px; transition: transform .2s; }
    .nav-group-btn.open .nav-chevron { transform: rotate(180deg); }
    .nav-dropdown {
      position: absolute; top: 100%; left: 0; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border); border-top: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 101;
      padding: 4px 0;
      opacity: 0; transform: translateY(-4px); pointer-events: none;
      transition: opacity .15s, transform .15s;
    }
    .nav-dropdown.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .nav-drop-item {
      display: block; width: 100%; background: none; border: none;
      color: var(--muted); font-family: inherit; font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer; text-align: left;
      white-space: nowrap; transition: color .15s, background .15s;
    }
    .nav-drop-item:hover { color: var(--text); background: var(--border); }
    .nav-drop-item.active { color: var(--accent); background: rgba(59,130,246,0.08); }

    /* ── Main layout ── */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px;
      padding-top: 68px;
    }

    /* ── Section ── */
    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-num {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--muted);
      background: var(--tag-bg);
      padding: 2px 7px;
      border-radius: 2px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }
    .section-icon {
      font-size: 14px;
      margin-left: auto;
    }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .cards-grid-3 {
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    }

    /* News headline cards */
    .headline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .headline-card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; transition: border-color .2s; text-decoration: none; color: inherit; }
    .headline-card:hover { border-color: var(--border2); }
    .headline-title { font-size: 11.5px; font-weight: 600; line-height: 1.5; color: var(--text); margin-bottom: 6px; }
    .headline-meta { font-size: 9px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .headline-source-tag { font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .oped-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin-top: 16px; }
    .oped-card { display: block; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 14px 16px; text-decoration: none; color: inherit; }
    .oped-card:hover { border-color: var(--border2); }
    .oped-title { font-size: 12px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; color: var(--text); }
    .oped-author { font-size: 10px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
    .oped-summary { font-size: 11px; color: var(--text); line-height: 1.6; margin-bottom: 8px; }
    .oped-meta { font-size: 9px; color: var(--muted); }
    .subsection-label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 20px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      position: relative;
      transition: border-color .2s;
    }
    .card:hover { border-color: var(--border2); }

    .card-accent-bull { border-left: 3px solid var(--bull); }
    .card-accent-bear { border-left: 3px solid var(--bear); }
    .card-accent-warn { border-left: 3px solid var(--warn); }
    .card-accent-neu  { border-left: 3px solid var(--neutral); }
    .card-accent-blue { border-left: 3px solid var(--accent); }

    .card-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand-color);
      line-height: 1.2;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color .15s, background .15s, border-color .15s;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--border2); }

    /* ── Subscribe button ── */
    .subscribe-btn {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--accent);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      transition: background .15s, border-color .15s;
    }
    .subscribe-btn:hover { background: rgba(59,130,246,0.2); border-color: var(--accent); }

    /* ── Subscribe modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      width: 340px;
      padding: 24px 24px 20px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px; right: 14px;
      background: none; border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 2px;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }
    .modal-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 18px;
    }
    .form-group { margin-bottom: 13px; }
    .form-label {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .form-label .req { color: var(--accent); margin-left: 2px; }
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 2px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--muted); opacity: 0.55; }
    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .submit-btn:disabled { background: var(--border2); color: var(--muted); cursor: not-allowed; opacity: 0.55; }
    .submit-btn:not(:disabled):hover { background: var(--accent2); }

    .card-value-sm { font-size: 18px; }

    .card-change {
      font-size: 11px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .bull { color: var(--bull); }
    .bear { color: var(--bear); }
    .warn { color: var(--warn); }
    .neu  { color: var(--neutral); }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ── Pill tags ── */
    .pill {
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 2px;
      font-weight: 600;
    }
    .pill-bull { background: var(--pill-bull); color: var(--bull); border: 1px solid rgba(34,197,94,0.25); }
    .pill-bear { background: var(--pill-bear); color: var(--bear); border: 1px solid rgba(239,68,68,0.25); }
    .pill-warn { background: var(--pill-warn); color: var(--warn); border: 1px solid rgba(245,158,11,0.25); }
    .pill-neu  { background: var(--pill-neu);  color: var(--neutral); border: 1px solid rgba(148,163,184,0.2); }
    .pill-blue { background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.25); }

    /* ── News items ── */
    .news-list { display: flex; flex-direction: column; gap: 8px; }
    .news-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .news-item:hover { border-color: var(--border2); }
    .news-bullet {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .news-content {}
    .news-headline {
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .news-source {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .news-source a {
      color: var(--accent);
      text-decoration: none;
    }
    .news-source a:hover { text-decoration: underline; }
    .news-time {
      font-size: 9px;
      color: var(--muted);
    }

    /* ── Ticker strip ── */
    .ticker-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .ticker-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ticker-name {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .ticker-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    .ticker-chg { font-size: 10px; }

    /* ── Table ── */
    .brief-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .brief-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      background: var(--surface);
    }
    .brief-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .brief-table tr:last-child td { border-bottom: none; }
    .brief-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* ── Two-col layout ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px; }
      .header { padding: 16px; }
      .nav-group-btn { padding: 10px 4px; font-size: 8px; letter-spacing: 0.04em; }
      .nav-dropdown { min-width: 140px; }
    }

    /* ── Context box ── */
    .context-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
    }
    .context-box strong { color: var(--text); }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text);
      opacity: 0.6;
      letter-spacing: 0.08em;
    }
    .footer a {
      color: var(--text);
      text-decoration: none;
    }
    .footer a:hover { color: var(--accent); opacity: 1; }
    @media (max-width: 768px) {
      .footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
        padding: 16px 20px calc(80px + env(safe-area-inset-bottom, 0px));
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Signal bar ── */
    .signal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .signal-label { font-size: 10px; color: var(--muted); min-width: 80px; }
    .signal-bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .signal-bar-fill { height: 100%; border-radius: 2px; }
    .signal-val { font-size: 10px; font-weight: 700; min-width: 50px; text-align: right; }

    /* ── Impact notice ── */
    .impact-banner {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }
    .impact-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
    .impact-text { font-size: 11px; color: var(--warn); line-height: 1.6; }
    .impact-text strong { color: #fff; }
    :root.light .impact-text strong { color: var(--text); }

    /* ── Sub-section heading ── */
    .sub-head {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      padding: 14px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    /* ── Section scroll target ── */
    .scroll-target { scroll-margin-top: 100px; }

    /* ── Time stamp ── */
    .ts {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ════════════════════════════════════════
       NEW ENHANCEMENTS — added Mar 2026
    ════════════════════════════════════════ */

    /* ── Traffic Light ── */
    .traffic-light {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }
    .tl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tl-dot.bull  { background: var(--bull); box-shadow: 0 0 5px var(--bull); }
    .tl-dot.bear  { background: var(--bear); box-shadow: 0 0 5px var(--bear); }
    .tl-dot.warn  { background: var(--warn); box-shadow: 0 0 5px var(--warn); }

function Sparkline({ data, color }) {
  const w = 80, h = 24, pad = 2;
  const vals = data.map(Number);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <div className="sparkline-wrap">
      <svg width={w} height={h} style={{ overflow: "visible" }}>

  );

function YieldCurveChart() {
  const [hovered, setHovered] = React.useState(null);
  const W = 680, H = 240;
  const pad = { top: 36, right: 50, bottom: 44, left: 52 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const maturities = ["3M", "6M", "1Y", "2Y", "5Y", "10Y", "15Y", "20Y"];
  const yields =     [9.88, 9.98, 9.93, 9.77, 9.00, 10.39, 10.37, 10.47];
  const n = maturities.length;

  const yMin = 8.6, yMax = 10.8;
  const cx = i => pad.left + (i / (n - 1)) * iW;
  const cy = v => pad.top + ((yMax - v) / (yMax - yMin)) * iH;
  const pts = yields.map((v, i) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(" ");

  const yTicks = [8.75, 9.00, 9.25, 9.50, 9.75, 10.00, 10.25, 10.50, 10.75];

  const policyY = cy(10.00);

  const areaPath = `M ${cx(0).toFixed(1)},${cy(yields[0]).toFixed(1)} ` +
    yields.map((v, i) => `L ${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(" ") +
    ` L ${cx(n - 1).toFixed(1)},${cy(yMin).toFixed(1)} L ${cx(0).toFixed(1)},${cy(yMin).toFixed(1)} Z`;

  const handleMouseMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) / rect.width * W;
    let closest = 0, closestDist = Infinity;
    for (let i = 0; i < n; i++) {
      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  };

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4, padding: "12px 0 4px", marginTop: 12 }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHovered(null)}>

        {yTicks.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={cy(v)} x2={W - pad.right} y2={cy(v)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3" />
            <text x={pad.left - 6} y={cy(v) + 4} fill="var(--muted)" fontSize="10" textAnchor="end">{v.toFixed(2)}%</text>
          </g>
        ))}

        <line x1={pad.left} y1={policyY} x2={W - pad.right} y2={policyY}
          stroke="rgba(234,179,8,0.6)" strokeWidth="1.5" strokeDasharray="6,3" />
        <text x={W - pad.right - 4} y={policyY - 4} fill="var(--warn)" fontSize="9" textAnchor="end" fontWeight="600">Policy 10%</text>

        <path d={areaPath} fill="rgba(59,130,246,0.08)" />

        <polyline points={pts} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />

        {yields.map((v, i) => (
          <g key={i}>
            <circle cx={cx(i)} cy={cy(v)} r={hovered === i ? 6 : 3.5} fill="var(--accent)" stroke="var(--surface)" strokeWidth="1.5" />
            <text x={cx(i)} y={cy(v) - 8} fill="var(--fg)" fontSize="9" textAnchor="middle" fontWeight="600">{v.toFixed(2)}%</text>
          </g>
        ))}

        <text x={cx(4)} y={cy(yields[4]) + 16} fill="var(--bear)" fontSize="8" textAnchor="middle" fontWeight="600">▼ 5Y dip 9.00%</text>
        <text x={cx(5)} y={cy(yields[5]) + 16} fill="var(--bear)" fontSize="8" textAnchor="middle" fontWeight="600">10Y 10.39%</text>

        {maturities.map((m, i) => (
          <text key={i} x={cx(i)} y={H - pad.bottom + 16} fill="var(--muted)" fontSize="10" textAnchor="middle">{m}</text>
        ))}

        <text x={W / 2} y={16} fill="var(--fg)" fontSize="11" textAnchor="middle" fontWeight="700" letterSpacing="0.05em">BANGLADESH YIELD CURVE — GOVERNMENT BONDS</text>

        {hovered !== null && (<>
          <line x1={cx(hovered)} y1={pad.top} x2={cx(hovered)} y2={H - pad.bottom}
            stroke="var(--muted)" strokeWidth="1" strokeDasharray="4,3" opacity="0.6" />
          <foreignObject
            x={Math.min(cx(hovered) + 10, W - 140)} y={Math.max(cy(yields[hovered]) - 40, pad.top)}
            width="130" height="44" style={{ pointerEvents: "none" }}>
            <div xmlns="http://www.w3.org/1999/xhtml" style={{ background: "white", border: "1px solid #ccc", borderRadius: 6, padding: "6px 10px", fontSize: 11, boxShadow: "0 2px 8px rgba(0,0,0,0.12)", pointerEvents: "none", color: "#222" }}>
              <strong>{maturities[hovered]}</strong>: {yields[hovered].toFixed(2)}%
            </div>
          </foreignObject>
        </>)}

      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "2px 14px 4px", fontSize: 10, color: "var(--muted)" }}>
        <span>Last update: 7 Apr 2026 · 91d from 2 Apr special: 9.88% · 182d: 9.98% · 364d: 9.93% (5 Apr auction) · 5Y: 9.00% · 10Y: 10.39%</span>
        <span style={{ marginLeft: "auto" }}>Source: Bangladesh Bank / World Government Bonds</span>
      </div>
    </div>
  );
}

      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  };

    return (

function TBillChart() {
  const [hovered, setHovered] = React.useState(null);
  const W = 680, H = 230;
  const pad = { top: 50, right: 62, bottom: 44, left: 52 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const yMin = 9.40, yMax = 10.85;
  const labels = ["Feb '26", "Mar '26", "Apr 2 (Spl)", "Apr 5 (Reg)"];
  const d91  = [10.02, 10.02, 9.88, 9.88];
  const d182 = [10.11, 10.11, 9.88, 9.98];
  const d364 = [10.07, 10.07, 9.88, 9.93];
  const n = labels.length;

  const cx = i => pad.left + (i / (n - 1)) * iW;
  const cy = v => pad.top + ((yMax - v) / (yMax - yMin)) * iH;
  const pts = arr => arr.map((v, i) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(" ");

  const policyY = cy(10.00);
  const yTicks  = [9.50, 9.75, 10.00, 10.25, 10.50, 10.75];

  const handleMouseMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) / rect.width * W;
    let closest = 0, closestDist = Infinity;
    for (let i = 0; i < n; i++) {
      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  };

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4, padding: "12px 0 4px", marginTop: 12 }}>
      <svg viewBox={`0 0 ${W} ${H + 28}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHovered(null)}>

        {yTicks.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={cy(v)} x2={W - pad.right} y2={cy(v)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3" />
            <text x={pad.left - 6} y={cy(v) + 4} fill="var(--muted)" fontSize="10" textAnchor="end">{v.toFixed(2)}%</text>
          </g>
        ))}

        <line x1={pad.left} y1={policyY} x2={W - pad.right} y2={policyY}
          stroke="rgba(234,179,8,0.6)" strokeWidth="1.5" strokeDasharray="6,3" />
        <text x={W - pad.right + 3} y={policyY + 4} fill="var(--warn)" fontSize="9" textAnchor="start">Policy 10%</text>

        <polyline points={pts(d91)}  fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" />
        <polyline points={pts(d182)} fill="none" stroke="var(--bull)"   strokeWidth="2" strokeLinejoin="round" />
        <polyline points={pts(d364)} fill="none" stroke="var(--warn)"   strokeWidth="2" strokeLinejoin="round" />

        {/* Annotation: special auction */}
        <line x1={cx(2)} y1={cy(d91[2]) + 4} x2={cx(2)} y2={H - pad.bottom + 28}
          stroke="var(--bear)" strokeWidth="1" strokeDasharray="3,2" />
        <rect x={cx(2) - 90} y={H - pad.bottom + 28} width="180" height="22" rx={3}
          fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.35)" strokeWidth="1" />
        <text x={cx(2)} y={H - pad.bottom + 37} fill="var(--bear)" fontSize="8.5" textAnchor="middle" fontWeight="700">2 Apr special auction</text>
        <text x={cx(2)} y={H - pad.bottom + 46} fill="var(--bear)" fontSize="8.5" textAnchor="middle">All tenors: 9.88% (Tk 50B raised)</text>

        {[d91, d182, d364].map((arr, si) => {
          const cols = ["var(--accent)", "var(--bull)", "var(--warn)"];
          return arr.map((v, i) => (
            <circle key={`${si}-${i}`} cx={cx(i)} cy={cy(v)} r={hovered === i ? 6 : 3}
              fill={cols[si]} stroke="var(--surface)" strokeWidth="1.5" />
          ));
        })}

        {labels.map((l, i) => (
          <text key={i} x={cx(i)} y={H - pad.bottom + 16} fill="var(--muted)" fontSize="10" textAnchor="middle">{l}</text>
        ))}

        <circle cx={pad.left + 10} cy={pad.top - 28} r={4} fill="var(--accent)" />
        <text x={pad.left + 18} y={pad.top - 24} fill="var(--fg)" fontSize="9.5">91-day</text>
        <circle cx={pad.left + 68} cy={pad.top - 28} r={4} fill="var(--bull)" />
        <text x={pad.left + 76} y={pad.top - 24} fill="var(--fg)" fontSize="9.5">182-day</text>
        <circle cx={pad.left + 130} cy={pad.top - 28} r={4} fill="var(--warn)" />
        <text x={pad.left + 138} y={pad.top - 24} fill="var(--fg)" fontSize="9.5">364-day</text>

        {hovered !== null && (<>
          <line x1={cx(hovered)} y1={pad.top} x2={cx(hovered)} y2={H - pad.bottom}
            stroke="var(--muted)" strokeWidth="1" strokeDasharray="4,3" opacity="0.6" />
          <foreignObject
            x={Math.min(cx(hovered) + 10, W - 180)} y={Math.max(Math.min(cy(d91[hovered]), cy(d182[hovered]), cy(d364[hovered])) - 60, pad.top)}
            width="170" height="70" style={{ pointerEvents: "none" }}>
            <div xmlns="http://www.w3.org/1999/xhtml" style={{ background: "white", border: "1px solid #ccc", borderRadius: 6, padding: "6px 10px", fontSize: 11, boxShadow: "0 2px 8px rgba(0,0,0,0.12)", pointerEvents: "none", color: "#222" }}>
              <strong>{labels[hovered]}</strong><br/>
              91d: {d91[hovered].toFixed(2)}% · 182d: {d182[hovered].toFixed(2)}%<br/>
              364d: {d364[hovered].toFixed(2)}%
            </div>
          </foreignObject>
        </>)}

      </svg>
      <div style={{ fontSize: 9, color: "var(--muted)", textAlign: "right", paddingRight: 12, marginTop: 4 }}>
        Source: Bangladesh Bank primary auction results · Policy rate: 10.00% · Special: 2 Apr 2026 · Regular: 5 Apr 2026 · Next special: 8 Apr (Tk 5,000cr 91-day)
      </div>
    </div>
  );
}

function LNGChart() {
  const [hovered, setHovered] = React.useState(null);
  const data = [
    { label: "Oct '25", value: 13.0 },
    { label: "Nov '25", value: 13.5 },
    { label: "Dec '25", value: 14.2 },
    { label: "Jan '26", value: 10.4 },
    { label: "Feb '26 early", value: 12.5 },
    { label: "Feb '26 late", value: 14.0, event: true },
    { label: "Mar '26 w1", value: 16.2 },
    { label: "Mar '26 w2", value: 16.2 },
    { label: "Mar 16", value: 16.2, today: true },
  ];

  const W = 720, H = 250;
  const pad = { top: 40, right: 58, bottom: 80, left: 54 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const vals   = data.map(d => d.value);
  const minV   = Math.floor((Math.min(...vals) - 1) / 2) * 2;
  const maxV   = Math.ceil ((Math.max(...vals) + 1) / 2) * 2;

  const cx = i => pad.left + (i / (data.length - 1)) * iW;
  const cy = v => pad.top  + ((maxV - v) / (maxV - minV)) * iH;

  const linePoints = data.map((d, i) => `${cx(i).toFixed(1)},${cy(d.value).toFixed(1)}`).join(" ");
  const areaPoints = `${cx(0).toFixed(1)},${(H-pad.bottom).toFixed(1)} ${linePoints} ${cx(data.length-1).toFixed(1)},${(H-pad.bottom).toFixed(1)}`;

  const gridVals = [];
  for (let v = minV + 2; v < maxV; v += 2) gridVals.push(v);

  const eIdx    = data.findIndex(d => d.event);
  const lastIdx = data.length - 1;
  const lastVal = data[lastIdx].value;
  const annotY  = H - pad.bottom + 30;

  const handleMouseMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) / rect.width * W;
    let closest = 0, closestDist = Infinity;
    for (let i = 0; i < data.length; i++) {
      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  };

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4, padding: "12px 0 0" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHovered(null)}>

        {/* Y-axis title */}
        <text x={0} y={0} fill="var(--muted)" fontSize="9.5" textAnchor="middle"
          transform={`translate(13,${(pad.top + (H - pad.bottom)) / 2}) rotate(-90)`}>Asian LNG Spot $/MMBtu</text>

        {/* Grid lines */}
        {gridVals.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={cy(v)} x2={W - pad.right} y2={cy(v)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3" />
            <text x={pad.left - 6} y={cy(v) + 4} fill="var(--muted)" fontSize="10" textAnchor="end">${v}</text>
          </g>
        ))}

        {/* Area fill */}
        <polygon points={areaPoints} fill="rgba(239,68,68,0.07)" />

        {/* Price line */}
        <polyline points={linePoints} fill="none" stroke="var(--bear)" strokeWidth="2.5" strokeLinejoin="round" />

        {/* Hormuz event annotation — below x-axis */}
        {eIdx >= 0 && (<>
          <line x1={cx(eIdx)} y1={cy(data[eIdx].value) + 6} x2={cx(eIdx)} y2={annotY}
            stroke="var(--bear)" strokeWidth="1" strokeDasharray="3,2" />
          <rect x={cx(eIdx) - 100} y={annotY} width={200} height={22} rx={3}
            fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)" strokeWidth="1" />
          <text x={cx(eIdx)} y={annotY + 14} fill="var(--bear)" fontSize="9" textAnchor="middle" fontWeight="700">Hormuz Disruption · LNG Surge</text>
        </>)}

        {/* Today label */}
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 12} fill="var(--bear)" fontSize="10" textAnchor="start" fontWeight="700">${lastVal.toFixed(1)}</text>
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 1}  fill="var(--bear)" fontSize="9"  textAnchor="start">TODAY</text>

        {/* Dots */}
        {data.map((d, i) => {
          const isToday = i === lastIdx;
          const isEvent = eIdx >= 0 && i === eIdx;
          return (
            <circle key={i} cx={cx(i)} cy={cy(d.value)}
              r={hovered === i ? 6 : (isToday || isEvent ? 4.5 : 2.5)}
              fill="var(--bear)"
              stroke="var(--surface)" strokeWidth="1.5" />
          );
        })}

        {/* X-axis labels */}
        {data.map((d, i) => (
          <text key={i} x={cx(i)} y={H - pad.bottom + 16}
            fill={i === lastIdx ? "var(--bear)" : "var(--muted)"}
            fontSize="9" textAnchor="middle">{d.label}</text>
        ))}

        {/* Hover crosshair + tooltip */}
        {hovered !== null && (<>
          <line x1={cx(hovered)} y1={pad.top} x2={cx(hovered)} y2={H - pad.bottom}
            stroke="var(--muted)" strokeWidth="1" strokeDasharray="4,3" opacity="0.6" />
          <foreignObject
            x={Math.min(cx(hovered) + 10, W - 160)} y={Math.max(cy(data[hovered].value) - 48, pad.top)}
            width="150" height="50" style={{ pointerEvents: "none" }}>
            <div xmlns="http://www.w3.org/1999/xhtml" style={{ background: "white", border: "1px solid #ccc", borderRadius: 6, padding: "6px 10px", fontSize: 11, boxShadow: "0 2px 8px rgba(0,0,0,0.12)", pointerEvents: "none", color: "#222" }}>
              <strong>{data[hovered].label}</strong><br/>
              ${data[hovered].value.toFixed(1)}/MMBtu
            </div>
          </foreignObject>
        </>)}

      </svg>

      {/* Legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "10px 20px", padding: "4px 16px 12px", fontSize: 10, color: "var(--muted)", alignItems: "center" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ display: "inline-block", width: 20, height: 2.5, background: "var(--bear)", borderRadius: 1 }} />
          Asian LNG Spot ($/MMBtu)
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: "var(--bear)" }} />
          Hormuz Disruption
        </span>
        <span style={{ marginLeft: "auto" }}>Source: Platts JKM / ICIS · Estimates</span>
      </div>
    </div>
  );
}

function OilChart() {
  const { useState, useEffect } = React;

  const AV_KEY = "T294W0RCT1U6OOPE";

  const STATIC_DATA = [
    { label: "Mar 25", value: 100.11 },
    { label: "Mar 26", value: 97.79 },
    { label: "Mar 27", value: 108.01 },
    { label: "Mar 29", value: 112.57 },
    { label: "Mar 30", value: 112.78 },
    { label: "Mar 31", value: 118.35 },
    { label: "Apr 1", value: 118.35 },
    { label: "Apr 2", value: 101.97 },
    { label: "Apr 3", value: 108.95 },
    { label: "Apr 5", value: 109.03 },
    { label: "Apr 6", value: 109.03 },
    { label: "Apr 7", value: 110.05, today: true },
  ];

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  const [data, setData]     = useState(STATIC_DATA);
  const [isLive, setIsLive] = useState(false);

  useEffect(() => {
    fetch(`https://www.alphavantage.co/query?function=BRENT&interval=daily&apikey=${AV_KEY}`)
      .then(r => r.json())
      .then(json => {
        if (!json.data || json.data.length === 0) return;
        // Take only the most recent valid price — update the last data point live
        // Chart structure stays locked to STATIC_DATA; only the current price refreshes
        const latest = json.data.find(d => parseFloat(d.value) > 0);
        if (!latest) return;
        const liveVal = parseFloat(latest.value);
        // Guard: AV free tier has 1-3 day lag — reject stale data if it
        // deviates more than 15% below the static value (e.g. post-spike events)
        const staticVal = STATIC_DATA[STATIC_DATA.length - 1].value;
        if (liveVal < staticVal * 0.85) return;
        setData(prev => {
          const updated = [...prev];
          updated[updated.length - 1] = { ...updated[updated.length - 1], value: liveVal };
          return updated;
        });
        setIsLive(true);
      })
      .catch(() => {});
  }, []);

  const W = 720, H = 270;
  const pad = { top: 46, right: 58, bottom: 100, left: 54 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const vals   = data.map(d => d.value);
  const minV   = Math.floor((Math.min(...vals) - 5) / 5) * 5;
  const maxV   = Math.ceil ((Math.max(...vals) + 5) / 5) * 5;

  const cx = i => pad.left + (i / (data.length - 1)) * iW;
  const cy = v => pad.top  + ((maxV - v) / (maxV - minV)) * iH;

  const linePoints = data.map((d, i) => `${cx(i).toFixed(1)},${cy(d.value).toFixed(1)}`).join(" ");

  const gridVals = [];
  for (let v = minV + 5; v < maxV; v += 5) gridVals.push(v);

  const eIdx    = Math.max(0, data.findIndex(d => d.event) === -1 ? Math.floor(data.length * 0.7) : data.findIndex(d => d.event));
  const lastIdx = data.length - 1;
  const lastVal = data[lastIdx].value;

  // Annotation box below x-axis labels so it never overlaps chart content
  const annotY = H - pad.bottom + 30;

  const handleMouseMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) / rect.width * W;
    let closest = 0, closestDist = Infinity;
    for (let i = 0; i < data.length; i++) {
      const dist = Math.abs(mouseX - cx(i));
      if (dist < closestDist) { closestDist = dist; closest = i; }
    }
    setHovered(closest);
  };

  return (
    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 4, padding: "12px 0 0" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHovered(null)}>

        {/* Y-axis title */}
        <text x={0} y={0} fill="var(--muted)" fontSize="9.5" textAnchor="middle"
          transform={`translate(13,${(pad.top + (H - pad.bottom)) / 2}) rotate(-90)`}>Brent $/bbl</text>

        {/* Grid lines */}
        {gridVals.map(v => (
          <g key={v}>
            <line x1={pad.left} y1={cy(v)} x2={W - pad.right} y2={cy(v)}
              stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3" />
            <text x={pad.left - 6} y={cy(v) + 4} fill="var(--muted)" fontSize="10" textAnchor="end">${v}</text>
          </g>
        ))}

        {/* Area fill */}
        <polygon points={areaPoints} fill="rgba(251,146,60,0.07)" />

        {/* Price line */}
        <polyline points={linePoints} fill="none" stroke="var(--warn)" strokeWidth="2.5" strokeLinejoin="round" />

        {/* Today label */}
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 12} fill="var(--warn)" fontSize="10" textAnchor="start" fontWeight="700">${lastVal.toFixed(2)}</text>
        <text x={cx(lastIdx) + 6} y={cy(lastVal) - 1}  fill="var(--warn)" fontSize="9"  textAnchor="start">TODAY</text>

        {/* Dots */}
        {data.map((d, i) => {
          const isToday = i === lastIdx;
          const isEvent = i === eIdx;
          return (
            <circle key={i} cx={cx(i)} cy={cy(d.value)}
              r={hovered === i ? 6 : (isToday || isEvent ? 4.5 : 2.5)}
              fill={isToday ? "var(--warn)" : isEvent ? "var(--bear)" : "var(--warn)"}
              stroke="var(--surface)" strokeWidth="1.5" />
          );
        })}

        {/* X-axis labels */}
        {data.map((d, i) => (

              <strong>{data[hovered].label}</strong><br/>

          </foreignObject>

      </svg>

      {/* Legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "10px 20px", padding: "4px 16px 12px", fontSize: 10, color: "var(--muted)", alignItems: "center" }}>

          { label: "Jul–Jan Collection", val: "৳2.08T", sub: "FY26", type: "neu" },
          { label: "Annual Target", val: "৳7.97T", sub: "FY26", type: "neu" },
          { label: "Progress vs Target", val: "26%", sub: "Severely lagging", type: "bear" },
          { label: "Gap vs Target Pace", val: "৳380B", sub: "Behind required run-rate", type: "bear" },
        ].map(c => (
          <div key={c.label} style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "10px 12px" }}>
            <div style={{ fontSize: 10, color: "var(--muted)", marginBottom: 4 }}>{c.label}</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: "var(--text)" }}>{c.val}</div>
            <div style={{ fontSize: 11, color: c.type === "bear" ? "var(--bear)" : "var(--muted)", marginTop: 2 }}>{c.sub}</div>
          </div>
        ))}
      </div>
      <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "12px 16px", marginBottom: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: "var(--muted)", marginBottom: 10 }}>REVENUE BREAKDOWN</div>
        {components.map(c => (
          <div key={c.label} style={{ marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 4 }}>
              <span style={{ color: "var(--text)", fontWeight: 600 }}>{c.label}</span>
              <span>{c.val} <span style={{ color: c.yoy.startsWith("+") ? "var(--bull)" : "var(--bear)", fontWeight: 700 }}>{c.yoy}</span></span>
            </div>
            <div style={{ background: "var(--bg)", borderRadius: 3, height: 8, overflow: "hidden" }}>
              <div style={{ width: `${c.pct}%`, background: c.color, height: "100%", borderRadius: 3 }} />
            </div>
            <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 2 }}>{c.pct}% of total collection</div>
          </div>
        ))}
      </div>
      <BankerRead insight="NBR's FY26 revenue target of Tk5.54 trillion is unachievable given the persistent shortfalls — December alone missed by Tk15,174 crore — and the industrial contraction driving down VAT, customs, and income tax collections simultaneously. Today 7 April, with only 84 days left in FY26, NBR would need to collect roughly Tk180-200 billion per month to meet even a revised target, versus the Tk36,191 crore achieved in December. Banks should factor in delayed government payments to contractors, suppliers, and subsidy-dependent entities when stress-testing receivables-backed loans — assume 60-90 day payment stretches as standard. If NBR announces any emergency tax measures such as advance tax on imports or bank transaction levies, immediately model the P&L impact and prepare a board memo quantifying the hit to net interest margin." />
    </div>
  );
}

  );
}

    { country: "India",      flag: "🇮🇳", gdp: "6.4%",  cpi: "4.3%",  fxr: "$638B",  cab: "-1.0%", rating: "BBB-",   highlight: false },

function App() {
  const [activeSection, setActiveSection] = useState("bb");
  const [dark, setDark] = useState(false);
  const [openGroup, setOpenGroup] = useState(null);

  // ── Subscribe modal state ─────────────────────────────────────────────────
  const [showSubscribe, setShowSubscribe] = useState(false);
  const [subName,       setSubName]       = useState("");
  const [subOrg,        setSubOrg]        = useState("");
  const [subEmail,      setSubEmail]      = useState("");
  const [subSubmitted,  setSubSubmitted]  = useState(false);
  const [subLoading,    setSubLoading]    = useState(false);
  const [subError,      setSubError]      = useState("");
  const canSubmit = subName.trim().length > 0 && subEmail.trim().length > 0 && !subLoading;

  async function handleSubscribe(e) {
    e.preventDefault();
    setSubLoading(true);
    setSubError("");
    const { error } = await _sb.from("subscribers").insert({
      name:         subName.trim(),
      organisation: subOrg.trim() || null,
      email:        subEmail.trim().toLowerCase(),
    });
    setSubLoading(false);
    if (error) {
      if (error.code === "23505") { setSubSubmitted(true); return; }
      setSubError("Something went wrong. Please try again.");
      return;
    }
    setSubSubmitted(true);
  }

  function closeModal() {
    setShowSubscribe(false);
    if (subSubmitted) {
      setSubName(""); setSubOrg(""); setSubEmail(""); setSubSubmitted(false);
    }
    setSubError("");
  }

  // ── Custom bottom-nav slots (persisted in localStorage) ───────────────────
  const [customSlots, setCustomSlots] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem("tb-custom-slots")) || ["remit","banking"]; }
    catch { return ["remit","banking"]; }
  });
  const [editingSlot, setEditingSlot] = React.useState(null);
  const lpTimer = React.useRef(null);

  const NAV_ICON = {
    bb:"🏦", macro:"📊", dse:"📈", tbond:"📜", comm:"🌾", dam:"🛒",
    fx:"💱", remit:"💸", banking:"🏛️", tariff:"🇺🇸", trade:"🚢",
    iranwar:"🛢️", rmg:"👕", fiscal:"💰", nbr:"🧾", power:"⚡", peers:"🌏"
  };

  function startLP(idx) {
    lpTimer.current = setTimeout(() => setEditingSlot(idx), 500);
  }
  function cancelLP() { clearTimeout(lpTimer.current); }

  function pickSlot(sectionId) {
    const next = [...customSlots];
    next[editingSlot] = sectionId;
    setCustomSlots(next);
    try { localStorage.setItem("tb-custom-slots", JSON.stringify(next)); } catch {}
    setEditingSlot(null);
  }

  useEffect(() => {
    document.documentElement.classList.toggle("light", !dark);
  }, [dark]);

  useEffect(() => {
    function positionNav() {
      const hdr = document.querySelector('.header');
      const nav = document.querySelector('.nav');
      const main = document.querySelector('.main');
      if (!hdr || !nav || !main) return;
      const hh = hdr.offsetHeight;
      const nh = nav.offsetHeight;
      nav.style.top = hh + 'px';
      main.style.paddingTop = (hh + nh + 4) + 'px';
    }
    positionNav();
    window.addEventListener('resize', positionNav);
    return () => window.removeEventListener('resize', positionNav);
  }, []);

  function scrollTo(id) {
    setActiveSection(id);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }

  useEffect(() => {
    function onScroll() {
      const ids = SECTIONS.map(s => s.id);
      for (let i = ids.length - 1; i >= 0; i--) {
        const el = document.getElementById(ids[i]);
        if (el && el.getBoundingClientRect().top <= 140) {
          setActiveSection(ids[i]);
          return;
        }
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // ── Close nav dropdown on click outside ──
  useEffect(() => {
    if (!openGroup) return;
    function handleClickOutside(e) {
      if (!e.target.closest('.nav-group')) setOpenGroup(null);
    }
    document.addEventListener('mousedown', handleClickOutside);
    document.addEventListener('touchstart', handleClickOutside);
    return () => {
      document.removeEventListener('mousedown', handleClickOutside);
      document.removeEventListener('touchstart', handleClickOutside);
    };
  }, [openGroup]);

  return (
    <div>
      {/* Header */}
      <header className="header">
        <div className="header-left">
          <div className="brand">THE <span>BRIEF</span></div>
          <div className="tagline">Bangladesh Business Intelligence</div>
        </div>
        <div className="header-right">
          <div className="date-stamp">{BRIEF_DATE}</div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, marginTop: 6 }}>
            <button className="subscribe-btn" onClick={() => setShowSubscribe(true)}>
              ✉ Subscribe
            </button>
            <button className="theme-toggle" onClick={() => setDark(d => !d)}>
              {dark ? "☀ Light" : "☾ Dark"}
            </button>
          </div>
        </div>
      </header>

      {/* Nav */}
      <nav className="nav">
        {NAV_GROUPS.map(g => {
          const isActiveGroup = g.ids.includes(activeSection);
          const isOpen = openGroup === g.key;
          return (
            <div key={g.key} className="nav-group">
              <button
                className={`nav-group-btn${isActiveGroup ? " active" : ""}${isOpen ? " open" : ""}`}
                onClick={() => setOpenGroup(isOpen ? null : g.key)}
              >
                {g.label}
                <span className="nav-chevron">&#9662;</span>
              </button>
              <div className={`nav-dropdown${isOpen ? " visible" : ""}`}>
                {g.ids.map(id => {
                  const sec = SECTIONS.find(s => s.id === id);
                  if (!sec) return null;
                  return (
                    <button key={id}
                      className={`nav-drop-item${activeSection === id ? " active" : ""}`}
                      onClick={() => { scrollTo(id); setOpenGroup(null); }}
                    >{sec.label}</button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </nav>

      {/* Body */}
      <main className="main">
        <SectionExec />
        <hr className="divider" />
        <SectionHeadlines />
        <hr className="divider" />
        <SectionBB />
        <hr className="divider" />
        <SectionBanking />
        <hr className="divider" />
        <SectionDSE />
        <hr className="divider" />
        <SectionTBond />
        <hr className="divider" />
        <SectionFX />
        <hr className="divider" />
        <SectionMacro />
        <hr className="divider" />
        <SectionDAM />
        <hr className="divider" />
        <SectionComm />
        <hr className="divider" />
        <SectionRemittance />
        <hr className="divider" />
        <SectionRMG />
        <hr className="divider" />
        <SectionTrade />
        <hr className="divider" />
        <SectionTariff />
        <hr className="divider" />
        <SectionIranWar />
        <hr className="divider" />
        <SectionFiscal />
        <hr className="divider" />
        <SectionNBR />
        <hr className="divider" />
        <SectionPower />
        <hr className="divider" />
        <SectionPeers />
      </main>

      {/* Mobile Bottom Nav */}
      <nav className="bottom-nav">
        {[
          { id: "exec",    icon: "📋", label: "Summary" },
          { id: "dse",     icon: "📈", label: "DSE" },
          { id: "iranwar", icon: "🛢️", label: "Iran/Oil" },
        ].map(s => (
          <button key={s.id}
            className={`bottom-nav-btn ${activeSection === s.id ? "active" : ""}`}
            onClick={() => scrollTo(s.id)}>
            <span className="bottom-nav-icon">{s.icon}</span>
            {s.label}
          </button>
        ))}
        {customSlots.map((sid, idx) => {
          const sec = SECTIONS.find(s => s.id === sid);
          if (!sec) return null;
          return (
            <button key={idx}
              className={`bottom-nav-btn customizable ${activeSection === sid ? "active" : ""}`}
              onClick={() => scrollTo(sid)}
              onPointerDown={() => startLP(idx)}
              onPointerUp={cancelLP}
              onPointerLeave={cancelLP}
              onContextMenu={e => { e.preventDefault(); setEditingSlot(idx); }}>
              <span className="bottom-nav-icon">{NAV_ICON[sid] || "📌"}</span>
              <span className="bottom-nav-edit-dot">✏️</span>
              {sec.short}
            </button>
          );
        })}
      </nav>

      {editingSlot !== null && (
        <div className="slot-picker">
          <div className="slot-picker-header">
            <span>Choose shortcut {editingSlot + 4}</span>
            <button className="slot-picker-close" onClick={() => setEditingSlot(null)}>✕</button>
          </div>
          <div className="slot-picker-grid">
            {SECTIONS
              .filter(s => !["exec","dse","iranwar"].includes(s.id) && !customSlots.includes(s.id))
              .map(s => (
                <button key={s.id}
                  className={`slot-picker-btn ${customSlots[editingSlot] === s.id ? "selected" : ""}`}
                  onClick={() => pickSlot(s.id)}>
                  <span className="slot-picker-btn-icon">{NAV_ICON[s.id] || "📌"}</span>
                  {s.short}
                </button>
              ))
            }
          </div>
        </div>
      )}

      <footer className="footer">
        <div>
          <span>Sources: </span>
          {[
            ["The Daily Star", "https://www.thedailystar.net"],
            ["TBS News", "https://www.tbsnews.net"],
            ["Financial Express BD", "https://today.thefinancialexpress.com.bd"],
            ["Bangladesh Bank", "https://www.bb.org.bd"],
            ["Trading Economics", "https://tradingeconomics.com/bangladesh"],
            ["Al Jazeera", "https://www.aljazeera.com"],
            ["Financial Times", "https://www.ft.com"],
          ].map(([name, url], i) => (
            <span key={i}>
              {i > 0 && " · "}
              <a href={url} target="_blank" rel="noreferrer">{name}</a>
            </span>
          ))}
        </div>
        <div>THE BRIEF · Bangladesh · {new Date().getFullYear()}</div>
      </footer>

      {showSubscribe && (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) closeModal(); }}>
          <div className="modal-card">
            <button className="modal-close" onClick={closeModal}>×</button>
            {subSubmitted ? (
              <div style={{ textAlign: "center", padding: "16px 0 8px" }}>
                <div style={{ fontSize: 32, color: "var(--bull)", marginBottom: 10 }}>✓</div>
                <div className="modal-title">You're on the list</div>
                <div className="modal-sub" style={{ marginTop: 6, marginBottom: 0 }}>
                  We'll send THE BRIEF to {subEmail} every morning.
                </div>
              </div>
            ) : (
              <>
                <div className="modal-title">Subscribe to THE BRIEF</div>
                <div className="modal-sub">Daily Bangladesh business intelligence, delivered to your inbox.</div>
                <form onSubmit={handleSubscribe}>
                  <div className="form-group">
                    <label className="form-label">Name <span className="req">*</span></label>
                    <input className="form-input" type="text" placeholder="Your name"
                      value={subName} onChange={e => setSubName(e.target.value)} autoFocus />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Organisation</label>
                    <input className="form-input" type="text" placeholder="Company / institution (optional)"
                      value={subOrg} onChange={e => setSubOrg(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Email Address <span className="req">*</span></label>
                    <input className="form-input" type="email" placeholder="you@example.com"
                      value={subEmail} onChange={e => setSubEmail(e.target.value)} />
                  </div>
                  <button className="submit-btn" type="submit" disabled={!canSubmit}>
                    {subLoading ? "Sending…" : "Subscribe →"}
                  </button>
                  {subError && (
                    <div style={{ color: "var(--bear)", fontSize: 10, letterSpacing: "0.05em", marginTop: 8, textAlign: "center" }}>
                      {subError}
                    </div>
                  )}
                </form>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
