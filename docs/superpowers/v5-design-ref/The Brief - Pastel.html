<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root {
  --bg: #e6e7fb;           /* soft lavender field */
  --ink: #0f0f12;
  --ink-2: #33333a;
  --ink-3: #6a6a73;
  --card-shadow: 0 10px 0 rgba(15,15,18,0.12);
  --hi: #f5f05a;           /* highlighter yellow */

  /* Card palette */
  --mint: #b4ecc7;
  --butter: #f2ecaf;
  --sky: #a8ecec;
  --lilac: #dcc3ef;
  --peach: #f6c9b9;
  --rose: #f0b8d0;

  /* semantics */
  --up: #1f6a3a;
  --down: #b02a2a;
  --warn: #9a6a10;
  --watch: #2e3f8a;

  --sans: 'Archivo', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --display: 'Archivo', sans-serif;
  --body: 'Space Grotesk', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(900px 500px at 90% 0%, rgba(220,195,239,0.6), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(168,236,236,0.4), transparent 60%);
}

a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 32px 100px;
}

/* ---------- Masthead ---------- */
.mast {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 24px 28px;
  box-shadow: var(--card-shadow);
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
  align-items: end;
  position: relative;
  overflow: hidden;
}
.mast::before {
  content: "";
  position: absolute;
  right: -40px; top: -40px; width: 160px; height: 160px;
  background: var(--hi); border-radius: 50%; z-index: 0;
  opacity: 0.7;
}
.mast-body { position: relative; z-index: 1; }
.mast-url {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  background: rgba(255,255,255,0.7);
  padding: 4px 10px; border-radius: 100px; border: 1px solid var(--ink);
  margin-bottom: 14px;
}
.mast-title {
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(40px, 6vw, 72px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
}
.mast-title .hi {
  background: var(--hi);
  padding: 0 10px;
  display: inline-block;
  border: 2px solid var(--ink);
  transform: rotate(-1.5deg);
  margin: 0 2px;
}
.mast-title em { font-style: italic; font-weight: 900;}
.mast-sub {
  font-family: var(--body);
  color: var(--ink-2); font-size: 16px;
  margin-top: 16px; max-width: 46ch;
}
.mast-cta {
  display: inline-flex; gap: 0; margin-top: 20px;
  border: 2px solid var(--ink); border-radius: 100px;
  overflow: hidden;
  background: var(--hi);
  box-shadow: 4px 4px 0 var(--ink);
}
.mast-cta span { padding: 10px 18px; font-weight: 700; font-family: var(--display); }
.mast-cta .arrow { background: #fff; padding: 10px 16px; border-left: 2px solid var(--ink); }

/* Masthead illustration side */
.mast-ill {
  background: var(--mint);
  border: 2px solid var(--ink);
  border-radius: 20px;
  padding: 18px 20px;
  position: relative; overflow: hidden;
  min-height: 220px;
}
.mast-ill .meta {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink);
}
.mast-ill h3 {
  font-family: var(--display); font-weight: 900;
  font-size: 28px; line-height: 1; margin: 12px 0 10px;
  letter-spacing: -0.02em;
  transform: rotate(-3deg); display: inline-block;
}
.mast-ill h3 .hi { background: var(--hi); border: 2px solid var(--ink); padding: 2px 8px;}
.mast-ill .tix {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
}
.tix-chip {
  background: #fff; border: 2px solid var(--ink); border-radius: 100px;
  padding: 4px 10px; font-family: var(--mono); font-size: 11px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tix-chip .up { color: var(--up); font-weight: 600; }
.tix-chip .down { color: var(--down); font-weight: 600; }
.mast-ill .newspaper {
  position: absolute; right: -10px; bottom: -20px;
  width: 180px; height: 180px; opacity: 0.9;
}

@media (max-width: 840px) {
  .mast { grid-template-columns: 1fr; }
  .mast-ill { min-height: 160px; }
}

/* ---------- Layout grid ---------- */
.row { display: grid; gap: 24px; margin-top: 28px; }
.row-3 { grid-template-columns: repeat(3, 1fr); }
.row-2 { grid-template-columns: repeat(2, 1fr); }
.row-4 { grid-template-columns: repeat(4, 1fr); }
.row-23 { grid-template-columns: 2fr 1fr; }
.row-32 { grid-template-columns: 1fr 2fr; }
@media (max-width: 1000px) {
  .row-3, .row-4 { grid-template-columns: repeat(2, 1fr); }
  .row-23, .row-32 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .row-3, .row-2, .row-4 { grid-template-columns: 1fr; }
  .page { padding: 16px 16px 60px; }
}

/* ---------- Card ---------- */
.card {
  border: 2px solid var(--ink);
  border-radius: 22px;
  padding: 22px;
  box-shadow: var(--card-shadow);
  position: relative;
  min-height: 180px;
  display: flex; flex-direction: column; gap: 12px;
}
.card.mint { background: var(--mint); }
.card.butter { background: var(--butter); }
.card.sky { background: var(--sky); }
.card.lilac { background: var(--lilac); }
.card.peach { background: var(--peach); }
.card.rose { background: var(--rose); }
.card.white { background: #fff; }

.card-kicker {
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
}
.card-kicker .tag {
  background: var(--ink); color: #fff; padding: 3px 10px; border-radius: 100px;
  font-weight: 600; letter-spacing: 0.12em;
}
.card-kicker .tag.em { background: var(--hi); color: var(--ink); border: 1px solid var(--ink);}

.card-title {
  font-family: var(--display); font-weight: 800;
  font-size: 22px; line-height: 1.1; letter-spacing: -0.01em;
  margin: 0; color: var(--ink);
}
.card-title em { font-style: italic; font-weight: 800;}
.card-title .hi {
  background: var(--hi); padding: 0 6px;
  border: 2px solid var(--ink);
  display: inline-block;
  transform: rotate(-1deg);
}

.card-foot {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-2);
  padding-top: 10px;
  border-top: 1.5px dashed rgba(15,15,18,0.25);
}

/* ---------- Metric inside pastel card ---------- */
.m-value {
  font-family: var(--display); font-weight: 900;
  font-size: 44px; letter-spacing: -0.03em; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.m-value .unit { font-size: 16px; font-weight: 600; margin-left: 6px; color: var(--ink-2); }
.m-delta {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 100px;
  border: 1.5px solid var(--ink);
  background: #fff;
  width: fit-content;
}
.m-delta.up { color: var(--up); }
.m-delta.down { color: var(--down); }
.m-delta.flat { color: var(--ink-2); }

.m-note {
  font-family: var(--body); color: var(--ink-2); font-size: 13px;
  line-height: 1.4;
}

.spark { display: block; }

/* ---------- Data state dot ---------- */
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block; border: 1.5px solid var(--ink);
}
.dot.fresh { background: var(--mint); }
.dot.warn, .dot.stale { background: var(--hi); }
.dot.pending { background: var(--sky); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 100px;
  border: 1.5px solid var(--ink);
  font-family: var(--mono); font-size: 10.5px;
  font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  background: #fff;
}
.pill.stale { background: var(--hi); }
.pill.pending { background: var(--sky); }

/* ---------- Section header (like "More on this story") ---------- */
.section-h {
  display: flex; align-items: center; gap: 14px;
  margin: 44px 4px 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--ink);
}
.section-h .num {
  font-family: var(--mono); font-size: 13px;
  background: var(--ink); color: #fff;
  padding: 4px 10px; border-radius: 100px;
}
.section-h h2 {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(28px, 3.5vw, 40px); margin: 0;
  letter-spacing: -0.02em; line-height: 1;
}
.section-h h2 em { font-style: italic; font-weight: 900;}
.section-h h2 .hi { background: var(--hi); padding: 0 8px; border: 2px solid var(--ink); display: inline-block; transform: rotate(-1deg);}
.section-h .meta {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-2); letter-spacing: 0.1em; text-transform: uppercase;
  display: flex; gap: 10px; align-items: center;
}

/* ---------- Exec signals ---------- */
.exec-wrap {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 24px 24px 16px;
  box-shadow: var(--card-shadow);
  margin-top: 28px;
}
.exec-h {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 14px;
}
.exec-h h2 {
  font-family: var(--display); font-weight: 900;
  font-size: 28px; letter-spacing: -0.02em; margin: 0;
}
.exec-h h2 .hi { background: var(--hi); padding: 0 8px; border: 2px solid var(--ink); transform: rotate(-1deg); display: inline-block;}
.exec-h .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2);}

.exec-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(2, 1fr);
}
@media (max-width: 720px) { .exec-grid { grid-template-columns: 1fr; } }

.exec-item {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 12px; align-items: center;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1.5px solid var(--ink);
  background: #fff;
  cursor: pointer;
  text-decoration: none; color: inherit;
}
.exec-item:hover { background: var(--hi); }
.exec-item:hover .exec-icon { background: var(--ink); color: var(--hi); }
.exec-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--ink);
  font-family: var(--mono); font-size: 13px; font-weight: 700;
}
.exec-icon.bull { background: var(--mint); color: var(--up); }
.exec-icon.bear { background: var(--peach); color: var(--down); }
.exec-icon.warn { background: var(--hi); color: var(--warn); }
.exec-icon.watch { background: var(--sky); color: var(--watch); }
.exec-text { font-family: var(--body); font-size: 15.5px; line-height: 1.35; }
.exec-text b { font-weight: 700; background: var(--hi); padding: 0 4px; }
.exec-num { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;}

/* ---------- BankerRead ---------- */
.br {
  border: 2px solid var(--ink);
  border-radius: 22px;
  padding: 20px 22px 18px;
  background: #fff;
  box-shadow: var(--card-shadow);
  position: relative;
}
.br.is-inline { margin-top: 20px; }
.br-k {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.br-k .bubble {
  background: var(--hi); border: 2px solid var(--ink);
  padding: 3px 12px; border-radius: 100px;
  font-family: var(--display); font-weight: 800; font-size: 14px;
  transform: rotate(-2deg);
}
.br-k .sub { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.br-body .s {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 10px;
  padding: 6px 0;
  font-family: var(--body); font-size: 15px; line-height: 1.45;
}
.br-body .s + .s { border-top: 1.5px dashed rgba(15,15,18,0.2); }
.br-body .lbl {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding-top: 3px;
}
.br-body .meaning .lbl { color: var(--ink); }
.br-body .action .lbl { color: var(--up); }
.br-body .trigger .lbl { color: var(--warn); }
.br-body .focus .lbl { color: var(--watch); }
.br-body b { font-weight: 700; background: var(--hi); padding: 0 3px;}
.br-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-top: 10px;
  border-top: 2px solid var(--ink);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
}
.br-foot a {
  background: var(--ink); color: #fff;
  padding: 4px 10px; border-radius: 100px; text-decoration: none;
  font-weight: 600;
}
.br-foot a:hover { background: var(--hi); color: var(--ink); border: 1px solid var(--ink);}

/* ---------- Headlines cards ---------- */
.hl-card {
  border: 2px solid var(--ink);
  border-radius: 22px;
  padding: 18px 20px;
  box-shadow: var(--card-shadow);
  display: flex; flex-direction: column; gap: 10px;
  min-height: 200px;
}
.hl-card .src {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase;
  display: inline-flex; gap: 6px; align-items: center;
}
.hl-card .src .tag {
  background: var(--ink); color: #fff;
  padding: 3px 10px; border-radius: 100px; font-weight: 700;
}
.hl-card .head {
  font-family: var(--display); font-weight: 800;
  font-size: 19px; line-height: 1.18; letter-spacing: -0.01em;
}
.hl-card .head::before { content: "—"; display: inline; margin-right: 4px; font-weight: 900;}
.hl-card .dek { font-family: var(--body); color: var(--ink-2); font-size: 13.5px; line-height: 1.4;}
.hl-card .foot {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10px; color: var(--ink-2);
  letter-spacing: 0.12em; text-transform: uppercase;
}

/* Key points box inside a lead headline */
.keypoints {
  background: #fff; border: 2px solid var(--ink); border-radius: 16px;
  padding: 14px 16px;
}
.keypoints h4 {
  font-family: var(--display); font-weight: 900; font-size: 14px;
  margin: 0 0 8px; background: var(--hi); padding: 2px 8px; display: inline-block;
  border: 2px solid var(--ink);
}
.keypoints ul { padding-left: 18px; margin: 0; }
.keypoints li { font-family: var(--body); font-size: 14px; line-height: 1.45; margin-bottom: 6px;}

/* ---------- Unavailable ---------- */
.unavail {
  border: 2px dashed var(--ink);
  border-radius: 22px;
  padding: 20px;
  background: repeating-linear-gradient(-12deg, transparent, transparent 10px, rgba(15,15,18,0.04) 10px, rgba(15,15,18,0.04) 20px);
  display: flex; flex-direction: column; gap: 8px;
  min-height: 180px;
}
.unavail .lbl {
  background: var(--hi); border: 2px solid var(--ink); border-radius: 100px;
  padding: 3px 10px; display: inline-flex; width: fit-content;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
}
.unavail .msg { font-family: var(--display); font-weight: 700; font-size: 18px; }
.unavail .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0.1em; text-transform: uppercase;}

/* ---------- Chart box ---------- */
.chart-box {
  background: #fff; border: 2px solid var(--ink); border-radius: 22px;
  padding: 18px 20px; box-shadow: var(--card-shadow);
}
.chart-box svg text { font-family: var(--mono); font-size: 10px; fill: var(--ink-2);}

/* ---------- Tweaks panel ---------- */
.tweaks {
  position: fixed; right: 22px; bottom: 22px;
  width: 280px; z-index: 9999;
  background: #fff; border: 2px solid var(--ink); border-radius: 22px;
  box-shadow: 6px 6px 0 var(--ink);
  font-family: var(--body); font-size: 13px;
}
.tweaks-h {
  padding: 10px 16px; border-bottom: 2px solid var(--ink);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--display); font-weight: 900; font-size: 14px;
  background: var(--hi); border-radius: 20px 20px 0 0;
}
.tweaks-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px;}
.tw-row { display: flex; flex-direction: column; gap: 6px;}
.tw-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);}
.tw-opts { display: flex; gap: 6px; flex-wrap: wrap;}
.tw-opt {
  padding: 5px 10px; border-radius: 100px; border: 1.5px solid var(--ink);
  background: #fff; color: var(--ink);
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
}
.tw-opt.on { background: var(--ink); color: var(--hi); }

/* ---------- Top nav bar ---------- */
.topnav {
  background: var(--lilac);
  border: 2px solid var(--ink); border-radius: 100px;
  padding: 10px 12px;
  display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
  box-shadow: var(--card-shadow);
  margin-bottom: 20px;
  overflow-x: auto;
}
.topnav .brand {
  font-family: var(--display); font-weight: 900; font-size: 15px;
  padding: 4px 14px; background: var(--ink); color: var(--hi);
  border-radius: 100px; white-space: nowrap;
}
.topnav a {
  padding: 6px 12px; border-radius: 100px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink); text-decoration: none;
  white-space: nowrap;
}
.topnav a:hover { background: var(--hi); border: 1.5px solid var(--ink);}
.topnav a.active { background: #fff; border: 1.5px solid var(--ink);}

/* ---------- Colophon ---------- */
.colo {
  background: #fff; border: 2px solid var(--ink);
  border-radius: 22px; padding: 18px 22px;
  box-shadow: var(--card-shadow);
  margin-top: 40px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
}

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);}
</style>
</head>
<body>
<div id="root"></div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "execLayout": "grid",
  "brPlacement": "inline",
  "cardMix": "varied"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TODAY = "Tue, 21 Apr 2026";
const ISSUE = "No. 412";

/* --------------- Data --------------- */

/* --------------- Primitives --------------- */
function StaleDot({ state = "fresh" }) {
  const t = { fresh:"Fresh", warn:"Warning", stale:"Stale", pending:"Pending release" }[state];
  return <span className={`dot ${state}`} title={t} aria-label={t}/>;
}
function Pill({ kind = "", children }) {
  return <span className={`pill ${kind}`}>{children}</span>;
}
function Sparkline({ data, color = "var(--ink)", w = 160, h = 40 }) {
  if (!data?.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const pad = 3;
  const step = (w - pad*2) / (data.length - 1);
  const pts = data.map((v,i) => [pad + i*step, pad + (h - pad*2) * (1 - (v-min)/range)]);
  const d = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const dArea = d + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <path d={dArea} fill={color} opacity="0.12"/>
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="3" fill={color} stroke="var(--ink)" strokeWidth="1.5"/>
    </svg>
  );
}

function Metric({ color = "white", label, value, unit, delta, deltaDir, asOf, source, cadence, state = "fresh", spark, note, nextRelease, tag }) {
  return (
    <div className={`card ${color}`}>
      <div className="card-kicker">
        <span style={{display:"inline-flex",alignItems:"center",gap:8}}>
          <StaleDot state={state}/>
          {label}
        </span>
        {tag && <span className="tag em">{tag}</span>}
      </div>
      <div className="m-value">{value}{unit && <span className="unit">{unit}</span>}</div>
      {delta && (
        <div className={`m-delta ${deltaDir || "flat"}`}>
          {deltaDir === "up" && "▲"}
          {deltaDir === "down" && "▼"}
          {deltaDir === "flat" && "–"}
          <span>{delta}</span>
        </div>
      )}
      {spark && <Sparkline data={spark} color={deltaDir === "up" ? "var(--up)" : deltaDir === "down" ? "var(--down)" : "var(--ink)"}/>}
      {note && <div className="m-note">{note}</div>}
      {nextRelease && <div><Pill kind="pending">Next release {nextRelease}</Pill></div>}
      <div className="card-foot">
        <span style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {cadence && <Pill>{cadence}</Pill>}
          {state === "stale" && <Pill kind="stale">Stale</Pill>}
        </span>
        <span>{source}{asOf && <> · {asOf}</>}</span>
      </div>
    </div>
  );
}

  const pts = [{t:"3M",y:11.85},{t:"6M",y:12.05},{t:"1Y",y:12.20},{t:"2Y",y:12.40},{t:"5Y",y:12.60},{t:"10Y",y:12.92}];
  const prev = [11.76,11.96,12.12,12.32,12.52,12.84];
  const w = 520, h = 240, pad = 34;
  const yMin = 11.5, yMax = 13.2;
  const x = i => pad + i * (w - pad*2) / (pts.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - yMin) / (yMax - yMin));
  const d = pts.map((p,i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(p.y).toFixed(1)).join(" ");
  const dPrev = prev.map((v,i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  return (
    <div className="chart-box">
      <div className="card-kicker" style={{marginBottom: 10}}><span>Yield curve · BDT Govt</span><Pill>Apr 17</Pill></div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`}>
        {[11.5,12.0,12.5,13.0].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--ink)" strokeDasharray="2 4" opacity="0.25"/>
            <text x={6} y={y(v)+3}>{v.toFixed(1)}</text>
          </g>
        ))}
        <path d={dPrev} fill="none" stroke="var(--ink-3)" strokeWidth="2" strokeDasharray="4 4"/>
        <path d={d} fill="none" stroke="var(--ink)" strokeWidth="3"/>
        {pts.map((p,i) => (
          <g key={p.t}>
            <circle cx={x(i)} cy={y(p.y)} r="5" fill="#f5f05a" stroke="var(--ink)" strokeWidth="2"/>
            <text x={x(i)} y={h-10} textAnchor="middle">{p.t}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function OilChart() {
  const data = sparkData.brent;
  const events = [
    { i: 3, label: "IAEA report", detail: "Apr 02" },
    { i: 8, label: "OPEC+ hold", detail: "Apr 11" },
    { i: 11, label: "Hormuz tanker", detail: "Apr 21", hot: true },
  ];
  const w = 1000, h = 220, pad = 40;
  const min = 80, max = 98;
  const x = i => pad + i * (w - pad*2) / (data.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - min) / (max - min));
  const pathD = data.map((v, i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const areaD = pathD + ` L${x(data.length-1)},${h-pad} L${x(0)},${h-pad} Z`;
  return (
    <div className="chart-box">
      <div className="card-kicker" style={{marginBottom: 10}}><span>Brent · 12 sessions · event pins</span><Pill>Daily</Pill></div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{overflow:"visible"}}>
        {[85, 90, 95].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--ink)" strokeDasharray="2 4" opacity="0.2"/>
            <text x={6} y={y(v)+3}>{v}</text>
          </g>
        ))}
        <path d={areaD} fill="#f5f05a" opacity="0.35"/>
        <path d={pathD} fill="none" stroke="var(--ink)" strokeWidth="2.5"/>
        {events.map(e => (
          <g key={e.label}>
            <line x1={x(e.i)} x2={x(e.i)} y1={pad} y2={h-pad} stroke={e.hot ? "var(--down)" : "var(--ink)"} strokeDasharray="3 4" strokeWidth="1"/>
            <circle cx={x(e.i)} cy={y(data[e.i])} r="5" fill={e.hot ? "var(--peach)" : "#fff"} stroke="var(--ink)" strokeWidth="2"/>
            <g transform={`translate(${x(e.i)}, ${pad - 22})`}>
              <rect x={-44} y={-14} width="88" height="20" fill={e.hot ? "var(--peach)" : "var(--hi)"} stroke="var(--ink)" strokeWidth="1.5" rx="10"/>
              <text x="0" y="0" textAnchor="middle" style={{fontWeight:700}}>{e.label}</text>
            </g>
          </g>
        ))}
        {data.map((v, i) => i % 2 === 0 && (
          <text key={i} x={x(i)} y={h-12} textAnchor="middle">{`D-${data.length-1-i}`}</text>
        ))}
      </svg>
    </div>
  );
}

  return (
    <aside className="tweaks" aria-label="Tweaks">
      <div className="tweaks-h"><span>Tweaks ✦</span><span style={{fontFamily:"var(--mono)", fontSize:10}}>Pastel</span></div>

    </aside>
  );
}

/* --------------- Root --------------- */
function App() {
  const [tweaks, setTweaks] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem("theBriefPastel.tweaks") || "null");
      return { ...TWEAK_DEFAULTS, ...(s || {}) };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });
  const [editVisible, setEditVisible] = useState(false);

  useEffect(() => { localStorage.setItem("theBriefPastel.tweaks", JSON.stringify(tweaks)); }, [tweaks]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setEditVisible(true);
      if (d.type === "__deactivate_edit_mode") setEditVisible(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = (k, v) => setTweaks(prev => {
    const next = { ...prev, [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
    return next;
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks.density]);

  return (
    <div className="page">
      <TopNav/>
      <Masthead/>
      <ExecSignals layout={tweaks.execLayout}/>

      <Policy brP={tweaks.brPlacement}/>
      <Macro brP={tweaks.brPlacement}/>
      <FX brP={tweaks.brPlacement}/>
      <Remittance brP={tweaks.brPlacement}/>
      <DSE brP={tweaks.brPlacement}/>
      <TBond brP={tweaks.brPlacement}/>
      <Oil brP={tweaks.brPlacement}/>
      <Headlines/>
      {tweaks.brPlacement === "bottom" && <BankerReadAggregate/>}
      <Secondary/>

      <div className="colo">
        <span>The Brief · Pastel · Daily Sun–Fri</span>
        <span>BB · BBS · DSE · EPB · MoF · NBR · TCB · Yahoo · Reuters · BBC · AJZ · DS · TBS · FE · FT</span>
        <span>{ISSUE}</span>
      </div>

      <Tweaks tweaks={tweaks} setTweak={setTweak} visible={editVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
