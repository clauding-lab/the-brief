<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Brief — Journal · Tue 21 Apr 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root {
  --paper: #f5efe3;      /* warm cream */
  --paper-2: #ece4d2;
  --paper-3: #e1d8c1;
  --ink: #11241c;        /* deep forest */
  --ink-2: #2b3d34;
  --ink-3: #546960;
  --ink-4: #8a9a91;

  --moss: #1e3a2e;       /* dark green card */
  --moss-2: #2f5041;
  --sage: #bfd4b8;       /* sage */
  --amber: #dca245;      /* mustard/amber */
  --amber-2: #e9b65d;
  --terra: #d88a6e;      /* terracotta */
  --terra-2: #ecb89c;
  --cream: #f8f2e4;

  --up: #2f6b3a;
  --down: #b2452f;
  --warn: #b0791c;
  --watch: #365375;

  --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
  --display: 'Fraunces', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

  --card-radius: 24px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(circle at 20% 10%, rgba(220, 162, 69, 0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(30, 58, 46, 0.06), transparent 45%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><g fill='none' stroke='%2311241c' stroke-width='0.4' opacity='0.06'><path d='M0,100 Q40,85 80,100 T160,100 T240,100'/><path d='M0,110 Q40,95 80,110 T160,110 T240,110'/><path d='M0,130 Q50,115 100,130 T200,130'/><path d='M0,150 Q40,135 80,150 T160,150 T240,150'/><path d='M0,70 Q60,55 120,70 T240,70'/></g></svg>");
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.page { max-width: 1280px; margin: 0 auto; padding: 28px 32px 100px; }

/* -------- Top bar -------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
  padding: 14px 22px;
  background: rgba(245,239,227,0.7);
  backdrop-filter: blur(4px);
  border: 1px solid var(--paper-3);
  border-radius: 100px;
}
.brand {
  font-family: var(--display); font-weight: 700; font-size: 20px;
  letter-spacing: -0.01em;
}
.brand .dot { color: var(--amber); }
.topbar-nav { display: flex; gap: 14px; flex-wrap: wrap;}
.topbar-nav a {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); text-decoration: none;
  padding: 6px 10px; border-radius: 100px;
}
.topbar-nav a:hover { background: var(--paper-2); color: var(--ink); }
.topbar-nav a.active { background: var(--ink); color: var(--paper); }
.topbar-right {
  display: flex; gap: 10px; align-items: center;
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--terra-2); border: 1px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink);
}

/* -------- Hero -------- */
.hero {
  background: var(--moss);
  color: var(--cream);
  border-radius: var(--card-radius);
  padding: 28px 32px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  align-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(17, 36, 28, 0.18);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(300px 160px at 90% 20%, rgba(220,162,69,0.18), transparent 70%),
    radial-gradient(400px 200px at 0% 100%, rgba(216,138,110,0.14), transparent 70%);
  pointer-events: none;
}
.hero-body { position: relative; z-index: 1;}
.hero-greet {
  display: inline-flex; gap: 10px; align-items: center;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 14px;
}
.hero-greet .bar { width: 24px; height: 1px; background: var(--amber); }
.hero-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 6vw, 68px);
  line-height: 0.98;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
  font-variation-settings: "opsz" 144, "SOFT" 30;
}
.hero-title em {
  font-style: italic; font-weight: 400; color: var(--amber);
  font-variation-settings: "opsz" 144, "SOFT" 100;
}
.hero-sub {
  color: rgba(248,242,228,0.82);
  font-size: 16px; line-height: 1.55;
  max-width: 48ch;
}
.hero-cta {
  display: inline-flex; align-items: center; gap: 12px;
  margin-top: 22px;
  background: var(--amber);
  color: var(--ink);
  font-family: var(--sans); font-weight: 600; font-size: 15px;
  padding: 14px 24px;
  border-radius: 100px;
  border: 0; cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}
.hero-cta:hover { background: var(--amber-2); }

/* Hero right: journaling card */
.hero-right {
  position: relative; z-index: 1;
  background: var(--cream);
  color: var(--ink);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.18);
}
.hero-right .h-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: 12px;
}
.hero-right h3 {
  font-family: var(--display); font-weight: 700;
  font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em;
}
.hero-right .h-dek { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
.hero-right .tick-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;}
.tick-li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.tick-box {
  width: 18px; height: 18px; border-radius: 5px;
  background: var(--amber); color: var(--ink);
  display: grid; place-items: center;
  font-weight: 700; font-size: 12px;
}
.tick-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums;}

@media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }

/* -------- Filter chips -------- */
.chips {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin: 26px 0 16px;
  padding: 6px;
}
.chip {
  padding: 10px 18px; border-radius: 100px;
  background: var(--paper-2); color: var(--ink-2);
  font-family: var(--sans); font-weight: 500; font-size: 14px;
  border: 0; cursor: pointer;
}
.chip.on { background: var(--ink); color: var(--paper); }

/* -------- Section header -------- */
.sec-h {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin: 44px 4px 18px; padding-bottom: 0;
}
.sec-h .num {
  font-family: var(--mono); font-size: 12px;
  color: var(--amber);
  letter-spacing: 0.16em; text-transform: uppercase;
  margin-bottom: 4px;
  display: block;
}
.sec-h h2 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 3.5vw, 40px);
  margin: 0; letter-spacing: -0.02em; line-height: 1.05;
}
.sec-h h2 em { font-style: italic; color: var(--amber-2); font-weight: 400; }
.sec-h .meta {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
  display: flex; gap: 10px; align-items: center;
}

/* -------- Grid -------- */
.row { display: grid; gap: 20px; }
.row-3 { grid-template-columns: repeat(3, 1fr); }
.row-4 { grid-template-columns: repeat(4, 1fr); }
.row-2 { grid-template-columns: repeat(2, 1fr); }
.row-23 { grid-template-columns: 2fr 1fr; }
.row-32 { grid-template-columns: 1fr 2fr; }
@media (max-width: 1000px) {
  .row-3, .row-4 { grid-template-columns: repeat(2, 1fr); }
  .row-23, .row-32 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .row-2, .row-3, .row-4 { grid-template-columns: 1fr; }
  .page { padding: 16px 16px 60px; }
}

/* -------- Card -------- */
.c {
  background: var(--cream);
  border-radius: var(--card-radius);
  padding: 22px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 190px;
  position: relative;
  border: 1px solid var(--paper-3);
}
.c.sage { background: var(--sage); color: var(--ink);}
.c.moss { background: var(--moss); color: var(--cream);}
.c.moss .kick, .c.moss .foot, .c.moss .lbl { color: rgba(248,242,228,0.7);}
.c.moss .delta { background: rgba(248,242,228,0.12); border-color: rgba(248,242,228,0.3);}
.c.amber { background: var(--amber); color: var(--ink);}
.c.terra { background: var(--terra); color: var(--ink);}
.c.terra-soft { background: var(--terra-2); color: var(--ink);}
.c.cream { background: var(--cream); color: var(--ink);}

.kick {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.kick .lbl {
  display: inline-flex; gap: 8px; align-items: center;
}
.tag {
  padding: 3px 10px; border-radius: 100px;
  background: var(--ink); color: var(--cream);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-weight: 600;
}
.tag.alt { background: var(--amber); color: var(--ink); }
.tag.soft { background: rgba(17,36,28,0.1); color: var(--ink);}
.c.moss .tag.soft { background: rgba(248,242,228,0.12); color: var(--cream);}

.m-value {
  font-family: var(--display); font-weight: 700;
  font-size: 42px; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin: 2px 0;
}
.m-value .unit { font-size: 15px; font-weight: 500; margin-left: 6px; opacity: 0.7;}

.delta {
  font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 100px;
  background: rgba(17,36,28,0.06);
  border: 1px solid rgba(17,36,28,0.12);
  width: fit-content;
}
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--ink-2); }
.c.moss .delta.up { color: var(--sage);}
.c.moss .delta.down { color: var(--terra-2);}
.c.moss .delta.flat { color: var(--cream);}

.note { font-size: 13px; color: var(--ink-2); line-height: 1.4;}
.c.moss .note { color: rgba(248,242,228,0.75);}

.foot {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px;
  border-top: 1px solid rgba(17,36,28,0.1);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
  flex-wrap: wrap; gap: 6px;
}
.c.moss .foot { border-top-color: rgba(248,242,228,0.12);}

/* state indicators */
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}
.dot.fresh { background: var(--up); }
.dot.warn, .dot.stale { background: var(--warn); }
.dot.pending { background: var(--watch); }

.pill {
  padding: 3px 9px; border-radius: 100px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: rgba(17,36,28,0.06); color: var(--ink-2);
  border: 1px solid transparent;
}
.pill.pending { background: #dde4ee; color: var(--watch);}
.pill.stale { background: #f2e3c8; color: var(--warn);}
.pill.warn { background: #f2e3c8; color: var(--warn);}
.c.moss .pill { background: rgba(248,242,228,0.15); color: var(--cream);}

/* -------- Exec Signals -------- */
.exec {
  background: var(--cream);
  border-radius: var(--card-radius);
  padding: 26px 28px 22px;
  margin-top: 24px;
  border: 1px solid var(--paper-3);
}
.exec-h {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--paper-3); padding-bottom: 14px; margin-bottom: 14px;
}
.exec-h h2 {
  font-family: var(--display); font-weight: 700;
  font-size: 26px; letter-spacing: -0.01em; margin: 0;
}
.exec-h h2 em { font-style: italic; color: var(--amber-2); }
.exec-h .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);}

.exec-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr);}
@media (max-width: 780px) { .exec-grid { grid-template-columns: 1fr; } }

.exec-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px; align-items: center;
  padding: 10px 14px;
  border-radius: 16px;
  background: var(--paper);
  border: 1px solid var(--paper-3);
  text-decoration: none; color: inherit; cursor: pointer;
}
.exec-item:hover { background: var(--amber); border-color: var(--amber);}
.exec-ico {
  width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-weight: 700;
}
.exec-ico.bull { background: #dce8d4; color: var(--up); }
.exec-ico.bear { background: #f3d9cd; color: var(--down); }
.exec-ico.warn { background: #f1e2c0; color: var(--warn); }
.exec-ico.watch { background: #d8e1ee; color: var(--watch); }
.exec-item:hover .exec-ico { background: var(--ink); color: var(--amber); }
.exec-text { font-size: 14.5px; line-height: 1.4;}
.exec-text b { font-weight: 700;}
.exec-num { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap;}

/* -------- BankerRead -------- */
.br {
  background: var(--moss); color: var(--cream);
  border-radius: var(--card-radius);
  padding: 22px 24px;
  margin-top: 20px;
  position: relative; overflow: hidden;
}
.br::before {
  content: ""; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(220,162,69,0.15); z-index: 0;
}
.br-k {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  position: relative; z-index: 1;
}
.br-k .bubble {
  background: var(--amber); color: var(--ink);
  padding: 4px 14px; border-radius: 100px;
  font-family: var(--display); font-weight: 700; font-size: 14px;
  letter-spacing: -0.01em;
}
.br-k .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(248,242,228,0.7);}

.br-body { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 4px;}
.br-body .s {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  padding: 10px 0;
  align-items: start;
  border-bottom: 1px dashed rgba(248,242,228,0.14);
  font-size: 15px; line-height: 1.45;
}
.br-body .s:last-child { border-bottom: 0; }
.br-body .s-lbl {
  width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  background: var(--amber); color: var(--ink);
}
.br-body .s.trigger .s-lbl { background: var(--terra); color: var(--ink);}
.br-body .s.focus .s-lbl { background: var(--sage); color: var(--ink);}
.br-body .s.meaning .s-lbl { background: var(--cream); color: var(--ink);}
.br-body b { color: var(--amber-2); font-weight: 600;}

.br-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid rgba(248,242,228,0.15);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(248,242,228,0.65);
  position: relative; z-index: 1;
}
.br-foot a {
  padding: 6px 14px; border-radius: 100px;
  background: var(--amber); color: var(--ink);
  text-decoration: none; font-weight: 600;
}
.br-foot a:hover { background: var(--cream);}

/* -------- Spark -------- */
.spark { display: block; }

/* -------- Chart box -------- */
.chart-box {
  background: var(--cream);
  border-radius: var(--card-radius);
  border: 1px solid var(--paper-3);
  padding: 20px 22px;
}
.chart-box .kick { margin-bottom: 12px;}
.chart-box svg text { font-family: var(--mono); font-size: 10px; fill: var(--ink-3);}

/* -------- Headlines -------- */
.hl {
  background: var(--cream);
  border-radius: var(--card-radius);
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 190px;
  border: 1px solid var(--paper-3);
}
.hl.lead { background: var(--moss); color: var(--cream); grid-row: span 2; }
.hl.lead .kick { color: rgba(248,242,228,0.7);}
.hl.lead .hl-dek { color: rgba(248,242,228,0.78);}
.hl.amber { background: var(--amber);}
.hl.terra { background: var(--terra);}
.hl.sage { background: var(--sage);}
.hl.terra-soft { background: var(--terra-2);}
.hl-src {
  display: flex; gap: 8px; align-items: center;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.hl.lead .hl-src { color: rgba(248,242,228,0.7);}
.hl-head {
  font-family: var(--display); font-weight: 700;
  font-size: 18px; line-height: 1.2; letter-spacing: -0.005em;
}
.hl.lead .hl-head { font-size: 26px;}
.hl-dek { font-size: 13.5px; color: var(--ink-2); line-height: 1.45;}
.hl-time { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: auto; letter-spacing: 0.12em; text-transform: uppercase;}
.hl.lead .hl-time { color: rgba(248,242,228,0.65);}

.keypoints {
  background: rgba(248,242,228,0.08);
  border-radius: 14px;
  padding: 14px 16px;
  margin-top: 4px;
}
.keypoints h4 {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--amber); margin: 0 0 10px;
}
.keypoints ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;}
.keypoints li {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start;
  font-size: 13.5px; line-height: 1.45;
  color: rgba(248,242,228,0.9);
}
.keypoints li::before {
  content: "✓"; width: 18px; height: 18px; border-radius: 5px;
  background: var(--amber); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
  margin-top: 2px;
}
.keypoints li b { color: var(--amber-2); font-weight: 600; }

/* -------- Unavailable -------- */
.unavail {
  background: var(--cream);
  border: 1px dashed var(--ink-3);
  border-radius: var(--card-radius);
  padding: 22px;
  min-height: 180px;
  display: flex; flex-direction: column; gap: 10px;
}
.unavail .msg { font-family: var(--display); font-weight: 700; font-size: 18px;}
.unavail .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase;}

function StaleDot({ state = "fresh" }) {
  const t = { fresh:"Fresh", warn:"Warning", stale:"Stale", pending:"Pending release" }[state];
  return <span className={`dot ${state}`} title={t} aria-label={t}/>;
}
function Pill({ kind = "", children }) { return <span className={`pill ${kind}`}>{children}</span>; }

function Sparkline({ data, color = "var(--ink)", w = 160, h = 40 }) {
  if (!data?.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const pad = 3;
  const step = (w - pad*2) / (data.length - 1);
  const pts = data.map((v,i) => [pad + i*step, pad + (h - pad*2) * (1 - (v-min)/range)]);
  const d = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const dArea = d + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <path d={dArea} fill={color} opacity="0.12"/>
      <path d={d} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.5" fill={color}/>
    </svg>
  );
}

function Metric({ color = "cream", label, value, unit, delta, deltaDir, asOf, source, cadence, state = "fresh", spark, note, nextRelease, tag }) {
  const sparkColor = color === "moss" ? "var(--amber)" : deltaDir === "up" ? "var(--up)" : deltaDir === "down" ? "var(--down)" : "var(--ink-2)";
  return (
    <div className={`c ${color}`}>
      <div className="kick">
        <span className="lbl"><StaleDot state={state}/>{label}</span>
        {tag && <span className="tag alt">{tag}</span>}
      </div>
      <div className="m-value">{value}{unit && <span className="unit">{unit}</span>}</div>
      {delta && (
        <div className={`delta ${deltaDir || "flat"}`}>
          {deltaDir === "up" && "▲"}
          {deltaDir === "down" && "▼"}
          {deltaDir === "flat" && "–"}
          <span>{delta}</span>
        </div>
      )}
      {spark && <Sparkline data={spark} color={sparkColor}/>}
      {note && <div className="note">{note}</div>}
      {nextRelease && <div><Pill kind="pending">Next release {nextRelease}</Pill></div>}
      <div className="foot">
        <span style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>

          {state === "stale" && <Pill kind="stale">Stale</Pill>}
          {state === "warn" && <Pill kind="warn">Aging</Pill>}
        </span>
        <span>{source}{asOf && <> · {asOf}</>}</span>
      </div>
    </div>
  );
}

function SectorHeat() {

    {name:"Fuel",pct:0.8},{name:"Telecom",pct:-0.6},{name:"Food",pct:0.2},{name:"IT",pct:0.1},
  ];
  return (
    <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap: 6, marginTop: 4}}>
      {sectors.map(s => {
        const mag = Math.min(Math.abs(s.pct)/2, 1);
        const col = s.pct >= 0 ? `color-mix(in oklab, var(--sage) ${mag*70+25}%, var(--cream))` : `color-mix(in oklab, var(--terra) ${mag*60+20}%, var(--cream))`;
        return (
          <div key={s.name} style={{background: col, borderRadius: 10, padding:"8px 6px", textAlign:"center", border: "1px solid rgba(17,36,28,0.08)"}}>
            <div style={{fontFamily:"var(--mono)", fontSize:10, letterSpacing:".08em", textTransform:"uppercase"}}>{s.name}</div>
            <div style={{fontFamily:"var(--display)", fontWeight:700, fontSize:14}}>{s.pct>0?"+":""}{s.pct.toFixed(1)}%</div>

function YieldCurve() {
  const pts = [{t:"3M",y:11.85},{t:"6M",y:12.05},{t:"1Y",y:12.20},{t:"2Y",y:12.40},{t:"5Y",y:12.60},{t:"10Y",y:12.92}];
  const prev = [11.76,11.96,12.12,12.32,12.52,12.84];
  const w = 520, h = 230, pad = 34;
  const yMin = 11.5, yMax = 13.2;
  const x = i => pad + i * (w - pad*2) / (pts.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - yMin) / (yMax - yMin));
  const d = pts.map((p,i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(p.y).toFixed(1)).join(" ");
  const dPrev = prev.map((v,i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  return (
    <div className="chart-box">
      <div className="kick" style={{marginBottom:10}}><span className="lbl">Yield curve · BDT Govt</span><Pill>Apr 17</Pill></div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`}>
        {[11.5,12.0,12.5,13.0].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--paper-3)"/>
            <text x={6} y={y(v)+3}>{v.toFixed(1)}</text>
          </g>
        ))}
        <path d={dPrev} fill="none" stroke="var(--ink-4)" strokeWidth="1.5" strokeDasharray="4 4"/>
        <path d={d} fill="none" stroke="var(--amber)" strokeWidth="3"/>
        {pts.map((p,i) => (
          <g key={p.t}>
            <circle cx={x(i)} cy={y(p.y)} r="4.5" fill="var(--amber)" stroke="var(--ink)" strokeWidth="1.5"/>
            <text x={x(i)} y={h-10} textAnchor="middle">{p.t}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function OilChart() {
  const data = sparkData.brent;
  const events = [
    { i: 3, label: "IAEA report", detail: "Apr 02" },
    { i: 8, label: "OPEC+ hold", detail: "Apr 11" },
    { i: 11, label: "Hormuz tanker", detail: "Apr 21", hot: true },
  ];
  const w = 1000, h = 220, pad = 40;
  const min = 80, max = 98;
  const x = i => pad + i * (w - pad*2) / (data.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - min) / (max - min));
  const pathD = data.map((v,i) => (i===0?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const areaD = pathD + ` L${x(data.length-1)},${h-pad} L${x(0)},${h-pad} Z`;
  return (
    <div className="chart-box">
      <div className="kick" style={{marginBottom:10}}><span className="lbl">Brent · 12 sessions · event pins</span><Pill>Daily</Pill></div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{overflow:"visible"}}>
        {[85,90,95].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--paper-3)"/>
            <text x={6} y={y(v)+3}>{v}</text>
          </g>
        ))}
        <path d={areaD} fill="var(--amber)" opacity="0.18"/>
        <path d={pathD} fill="none" stroke="var(--ink)" strokeWidth="2.2"/>
        {events.map(e => (
          <g key={e.label}>
            <line x1={x(e.i)} x2={x(e.i)} y1={pad} y2={h-pad} stroke={e.hot ? "var(--down)" : "var(--ink-3)"} strokeDasharray="3 4" strokeWidth="1"/>
            <circle cx={x(e.i)} cy={y(data[e.i])} r="5" fill={e.hot ? "var(--terra)" : "var(--amber)"} stroke="var(--ink)" strokeWidth="1.5"/>
            <g transform={`translate(${x(e.i)}, ${pad - 22})`}>
              <rect x={-44} y={-13} width="88" height="20" fill={e.hot ? "var(--terra)" : "var(--cream)"} stroke="var(--ink)" strokeWidth="1" rx="10"/>
              <text x="0" y="1" textAnchor="middle" style={{fontWeight:700, fill:"var(--ink)"}}>{e.label}</text>
            </g>
          </g>
        ))}
        {data.map((v,i) => i % 2 === 0 && (
          <text key={i} x={x(i)} y={h-12} textAnchor="middle">{`D-${data.length-1-i}`}</text>
        ))}
      </svg>
    </div>
  );
}

function Tweaks({ tweaks, setTweak, visible }) {

  return (
    <aside className="tweaks" aria-label="Tweaks">
      <div className="tweaks-h"><span>Tweaks</span><span style={{fontFamily:"var(--mono)", fontSize:10, letterSpacing:".12em", textTransform:"uppercase"}}>Journal</span></div>

        <div className="tw-row">

          <div className="tw-opts">

        <div className="tw-row">

          </div>
        </div>
      </div>
    </aside>
  );
}

/* ============ ROOT ============ */
function App() {
  const [tweaks, setTweaks] = useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem("theBriefJournal.tweaks") || "null");
      return { ...TWEAK_DEFAULTS, ...(s || {}) };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });
  const [editVisible, setEditVisible] = useState(false);

  useEffect(() => { localStorage.setItem("theBriefJournal.tweaks", JSON.stringify(tweaks)); }, [tweaks]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setEditVisible(true);
      if (d.type === "__deactivate_edit_mode") setEditVisible(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = (k, v) => setTweaks(prev => {
    const next = { ...prev, [k]: v };
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
    return next;
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks.density]);

  return (
    <div className="page">
      <TopBar/>
      <Hero/>
      <Chips/>
      <ExecSignals layout={tweaks.execLayout}/>

      <Policy brP={tweaks.brPlacement}/>
      <Macro brP={tweaks.brPlacement}/>
      <FX brP={tweaks.brPlacement}/>
      <Remit brP={tweaks.brPlacement}/>
      <DSE brP={tweaks.brPlacement}/>
      <TBond brP={tweaks.brPlacement}/>
      <Oil brP={tweaks.brPlacement}/>
      <Headlines/>
      {tweaks.brPlacement === "bottom" && <BRAggregate/>}
      <Secondary/>

      <div className="colo">
        <span><span className="amber">The Brief</span> · Journal · Sun–Fri</span>
        <span>BB · BBS · DSE · EPB · MoF · NBR · TCB · Yahoo · Reuters · BBC · AJZ · DS · TBS · FE · FT</span>
        <span>{ISSUE}</span>
      </div>

      <Tweaks tweaks={tweaks} setTweak={setTweak} visible={editVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
