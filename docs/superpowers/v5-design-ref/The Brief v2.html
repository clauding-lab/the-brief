<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Brief — Tue 21 Apr 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,900;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root {
  /* Paper */
  --paper: #faf7f0;
  --paper-2: #f4efe3;
  --paper-3: #ece5d3;
  --ink: #1a1815;
  --ink-2: #3a352e;
  --ink-3: #6a6358;
  --ink-4: #9a8f80;
  --rule: #1a1815;
  --rule-soft: #d8cfba;
  --rule-hair: #e8e1cf;

  /* Accents (editorial palette - default) */
  --up: #2f6b3a;        /* editorial green */
  --down: #a8322a;      /* brick red */
  --warn: #b57a15;      /* amber */
  --watch: #2a4d7a;     /* ink blue */
  --up-bg: #e8efe3;
  --down-bg: #f2e4e1;
  --warn-bg: #f4ebd5;
  --watch-bg: #e0e7ef;

  /* Density */
  --pad-col: 28px;
  --pad-row: 22px;
  --lede: 1.08rem;
  --h-gap: 56px;

  /* Type */
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

[data-accent="terminal"] {
  --up: #0b7a5a;
  --down: #b23a7a;
  --warn: #c08a2a;
  --watch: #2a6aa8;
  --up-bg: #dff0ea;
  --down-bg: #f4e2ee;
  --warn-bg: #f6edd5;
  --watch-bg: #e0eaf4;
}
[data-accent="muted"] {
  --up: #55614b;
  --down: #8a4a42;
  --warn: #8a7236;
  --watch: #455a72;
  --up-bg: #ebede3;
  --down-bg: #f1e5e0;
  --warn-bg: #efe8d4;
  --watch-bg: #e4e8ec;
}

[data-density="compact"] {
  --pad-col: 18px;
  --pad-row: 14px;
  --h-gap: 36px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}

body { background-image:
  radial-gradient(1200px 600px at 10% -200px, rgba(122,98,45,0.04), transparent 60%),
  radial-gradient(900px 500px at 95% 5%, rgba(47,107,58,0.03), transparent 60%);
}

a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--watch); outline-offset: 2px; border-radius: 2px; }

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 36px 80px;
}

/* ---------- Masthead ---------- */
.masthead {
  padding-top: 18px;
}
.masthead .top-rule { height: 1px; background: var(--rule); margin-bottom: 12px; }
.masthead-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
}
.masthead-title {
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(64px, 11vw, 128px);
  letter-spacing: -0.03em;
  line-height: 0.92;
  text-align: center;
  margin: 14px 0 4px;
  font-variation-settings: "opsz" 60;
}
.masthead-title em {
  font-style: italic;
  font-weight: 400;
  font-variation-settings: "opsz" 60;
}
.masthead-sub {
  text-align: center;
  font-family: var(--serif);
  font-style: italic;
  color: var(--ink-2);
  font-size: 16px;
  margin-bottom: 18px;
}

/* ---------- Read-first panel (new) ---------- */
.masthead-body {
  display: grid;
  grid-template-columns: 1fr minmax(280px, 360px);
  gap: 36px;
  align-items: center;
  padding: 8px 0 18px;
}
.masthead-body .m-left { min-width: 0; }
.readfirst {
  border-left: 1px solid var(--rule);
  padding: 6px 0 6px 24px;
}
.readfirst-k {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: 2px;
}
.readfirst-title {
  font-family: var(--serif); font-weight: 700;
  font-size: 22px; letter-spacing: -0.01em; line-height: 1.1;
  margin: 0 0 4px;
}
.readfirst-title em { font-style: italic; font-weight: 400; color: var(--ink-2); }
.readfirst-dek {
  font-family: var(--serif); font-style: italic; font-size: 13.5px;
  color: var(--ink-3); margin-bottom: 12px;
}
.readfirst ol {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column;
  border-top: 1px solid var(--rule-hair);
}
.readfirst li {
  display: grid;
  grid-template-columns: 16px 18px 1fr auto;
  gap: 10px; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule-hair);
  font-size: 13.5px;
  text-decoration: none; color: inherit;
}
.readfirst li:hover { background: var(--paper-2); }
.readfirst li .rf-n {
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  letter-spacing: 0.06em;
}
.readfirst li .rf-icon {
  width: 16px; height: 16px;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  border-radius: 3px;
}
.readfirst li .rf-icon.bull { color: var(--up); background: var(--up-bg); }
.readfirst li .rf-icon.bear { color: var(--down); background: var(--down-bg); }
.readfirst li .rf-icon.warn { color: var(--warn); background: var(--warn-bg); }
.readfirst li .rf-icon.watch { color: var(--watch); background: var(--watch-bg); }
.readfirst li .rf-text b { font-weight: 600; }
.readfirst li .rf-num {
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--ink-3); white-space: nowrap;
}

@media (max-width: 900px) {
  .masthead-body { grid-template-columns: 1fr; gap: 20px; }
  .readfirst { border-left: 0; border-top: 1px solid var(--rule); padding: 18px 0 0; }
}
.masthead-bar {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 3px double var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 8px 4px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  letter-spacing: 0.08em; text-transform: uppercase;
}

.masthead-ticker {
  display: flex; gap: 28px; overflow: hidden; white-space: nowrap;
  font-family: var(--mono); font-size: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--rule-hair);
  color: var(--ink-2);
}
.masthead-ticker b { color: var(--ink); font-weight: 600; margin-right: 8px;}
.masthead-ticker .up { color: var(--up); }
.masthead-ticker .down { color: var(--down); }

/* ---------- Section chrome ---------- */
.sec {
  padding-top: 24px;
  margin-top: var(--h-gap);
  border-top: 1px solid var(--rule);
}
.sec:first-of-type { margin-top: 28px; }
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px;
}
.kicker {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3);
}
.sec-title {
  font-family: var(--serif); font-weight: 700; font-size: 34px;
  letter-spacing: -0.01em; line-height: 1.05;
  margin: 2px 0 0;
}
.sec-title em { font-style: italic; font-weight: 400; color: var(--ink-2);}
.sec-dek {
  font-family: var(--serif); font-style: italic; color: var(--ink-3);
  font-size: 15px; max-width: 72ch; margin-top: 6px;
}
.sec-meta {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.08em; text-transform: uppercase;
}

.sec-body { display: grid; gap: var(--pad-col); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-12 { grid-template-columns: repeat(12, 1fr); }

@media (max-width: 900px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-12 { grid-template-columns: repeat(6, 1fr); }
  .page { padding: 16px 18px 60px; }
}
@media (max-width: 560px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .grid-12 { grid-template-columns: repeat(2, 1fr); }
  .sec-title { font-size: 26px; }
}

/* ---------- MetricCard ---------- */
.metric {
  display: flex; flex-direction: column; gap: 6px;
  padding: var(--pad-row) 0 var(--pad-row) 18px;
  border-left: 1px solid var(--rule-soft);
  position: relative;
  min-height: 120px;
}
.metric.flush { padding-left: 0; border-left: 0; }
.metric .label {
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 8px;
}
.metric .value {
  font-family: var(--mono); font-weight: 500;
  font-size: 30px; letter-spacing: -0.02em; color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}
.metric .value .unit { font-size: 13px; color: var(--ink-3); margin-left: 4px; font-weight: 400; letter-spacing: 0; }
.metric .delta {
  font-family: var(--mono); font-size: 12px;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 6px;
}
.metric .delta.up { color: var(--up); }
.metric .delta.down { color: var(--down); }
.metric .delta.flat { color: var(--ink-3); }
.metric .foot {
  margin-top: auto;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding-top: 8px;
}
.metric .spark { margin: 2px 0 4px; }

/* StaleDot */
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.dot.fresh { background: var(--up); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.dot.stale { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.dot.pending { background: var(--watch); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 100px;
  border: 1px solid var(--rule-soft);
  color: var(--ink-3);
  background: transparent;
}
.pill.daily { border-color: var(--up); color: var(--up); }
.pill.weekly { border-color: var(--watch); color: var(--watch); }
.pill.monthly { border-color: var(--ink-2); color: var(--ink-2); }
.pill.event { border-color: var(--down); color: var(--down); }
.pill.pending { background: var(--watch-bg); border-color: var(--watch); color: var(--watch); }
.pill.stale { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }

/* ---------- Exec Signals ---------- */
.exec {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  padding: 22px 28px 24px;
  margin-top: 28px;
}
.exec.compact { padding: 16px 20px; }
.exec h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.exec .dek {
  font-family: var(--serif); font-style: italic;
  color: var(--ink-3); font-size: 14px; margin-bottom: 14px;
}
.exec-list { list-style: none; padding: 0; margin: 0;
  display: grid; gap: 10px 28px;
}
.exec-list.list { grid-template-columns: 1fr; }
.exec-list.grid { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 720px) { .exec-list.grid { grid-template-columns: 1fr; } }

.exec-item {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dotted var(--rule-soft);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.exec-item:last-child { border-bottom: 0; }
.exec-item:hover { background: rgba(0,0,0,0.02); }
.exec-icon { font-family: var(--mono); font-size: 13px; line-height: 1; }
.exec-icon.bull { color: var(--up); }
.exec-icon.bear { color: var(--down); }
.exec-icon.warn { color: var(--warn); }
.exec-icon.watch { color: var(--watch); }
.exec-text { font-family: var(--serif); font-size: 16px; line-height: 1.4; }
.exec-text b { font-weight: 600; }
.exec-num { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;}
.exec-anchor { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase;}

/* Ticker layout */
.exec-ticker {
  display: flex; gap: 40px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 6px 0 14px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.exec-ticker .exec-item {
  display: inline-grid;
  grid-template-columns: 22px 1fr;
  border: 0; min-width: 260px; scroll-snap-align: start;
  padding: 10px 0;
}
.exec-ticker .exec-item .exec-num, .exec-ticker .exec-item .exec-anchor { display: none; }

/* ---------- BankerRead ---------- */
.br {
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 18px 20px;
  position: relative;
}
.br.inline { margin-top: 16px; }
.br.rail { position: sticky; top: 20px; }
.br-kicker {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink);
  margin-bottom: 10px;
}
.br-kicker::before, .br-kicker::after {
  content: ""; flex: 0 0 14px; height: 1px; background: var(--ink);
}
.br-kicker::after { flex: 1; }
.br-body {
  font-family: var(--serif);
  font-size: 15.5px; line-height: 1.55;
  color: var(--ink);
}
.br-body .s {
  display: block;
  padding-left: 18px;
  position: relative;
  margin-bottom: 6px;
}
.br-body .s::before {
  position: absolute; left: 0; top: 0;
  font-family: var(--mono); font-size: 9px; color: var(--ink-3);
  letter-spacing: 0.1em;
}
.br-body .s.meaning::before { content: "A"; }
.br-body .s.action::before { content: "B"; color: var(--up); }
.br-body .s.trigger::before { content: "C"; color: var(--warn); }
.br-body .s.focus::before { content: "D"; color: var(--watch); }
.br-body .s b { font-weight: 600; }
.br-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-top: 10px;
  border-top: 1px dotted var(--rule-soft);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
}
.br-foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 1px;}

/* Aggregated BankerRead panel (bottom placement) */
.br-agg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
@media (max-width: 820px) { .br-agg { grid-template-columns: 1fr; } }

/* Rail layout */
.layout-rail .sec-body.with-rail { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .layout-rail .sec-body.with-rail { grid-template-columns: 1fr; } }

/* ---------- Headlines ---------- */
.headlines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
@media (max-width: 900px) { .headlines { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .headlines { grid-template-columns: 1fr; } }
.hl {
  padding: 14px 18px 18px;
  border-left: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  display: flex; flex-direction: column; gap: 6px;
  min-height: 150px;
}
.hl:nth-child(3n+1) { border-left: 0; padding-left: 0; }
.hl-src {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.hl-src .srcname {
  padding: 1px 6px; background: var(--paper-3); color: var(--ink-2); border-radius: 2px;
  font-weight: 600;
}
.hl-src .srcname[data-src="DS"] { background: #efe1de; color: #7a2a22; }
.hl-src .srcname[data-src="TBS"] { background: #e4ecd8; color: #3d5522; }
.hl-src .srcname[data-src="FE"] { background: #e8e0ee; color: #422a66; }
.hl-src .srcname[data-src="FT"] { background: #f7e3c3; color: #7a4e15; }
.hl-src .srcname[data-src="REU"] { background: #f3dcd2; color: #7a3820; }
.hl-src .srcname[data-src="BBC"] { background: #e0e3ed; color: #1a2a66; }
.hl-src .srcname[data-src="AJZ"] { background: #d9e6df; color: #1e4a3a; }
.hl-title {
  font-family: var(--serif); font-size: 17px; font-weight: 600;
  line-height: 1.25; letter-spacing: -0.005em;
  color: var(--ink);
}
.hl-dek { font-family: var(--serif); font-size: 13.5px; color: var(--ink-2); line-height: 1.4;}
.hl-time { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: auto; letter-spacing: 0.1em; text-transform: uppercase;}

/* ---------- Section unavailable ---------- */
.unavail {
  border: 1px dashed var(--rule-soft);
  padding: 20px;
  min-height: 150px;
  display: flex; flex-direction: column; gap: 8px;
  background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.02) 8px, rgba(0,0,0,0.02) 16px);
}
.unavail .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--warn);}
.unavail .msg { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 14px;}
.unavail .lastknown { font-family: var(--mono); font-size: 11px; color: var(--ink-3);}

/* ---------- Tweaks ---------- */
.tweaks {
  position: fixed;
  right: 20px; bottom: 20px;
  width: 280px;
  background: var(--paper);
  border: 1px solid var(--ink);
  box-shadow: 0 14px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
  font-family: var(--sans); font-size: 12px;
  z-index: 9999;
}
.tweaks-h {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--paper-2);
}
.tweaks-b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.tw-row { display: flex; flex-direction: column; gap: 6px; }
.tw-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);}
.tw-opts { display: flex; gap: 4px; flex-wrap: wrap; }
.tw-opt {
  padding: 5px 9px; font-family: var(--mono); font-size: 10.5px;
  background: var(--paper); color: var(--ink-2);
  border: 1px solid var(--rule-soft);
  cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
}
.tw-opt.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tw-opt:hover:not(.on) { border-color: var(--ink-3); }

/* ---------- Small utilities ---------- */
.rule-thick { height: 2px; background: var(--ink); margin: 6px 0 14px;}
.drop::first-letter {

function StaleDot({ state = "fresh" }) {
  const title = { fresh: "Fresh", warn: "Warning", stale: "Stale", pending: "Pending release" }[state];
  return <span className={`dot ${state}`} title={title} aria-label={title}/>;

function Cadence({ kind = "daily" }) {
  const map = { daily: "Daily", weekly: "Weekly", monthly: "Monthly", event: "Event" };
  return <span className={`pill ${kind}`}>{map[kind]}</span>;
}

function Sparkline({ data, color = "var(--ink-2)", w = 140, h = 34, fill = true }) {
  if (!data?.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const pad = 2;
  const range = (max - min) || 1;
  const step = (w - pad*2) / (data.length - 1);
  const pts = data.map((v, i) => [pad + i*step, pad + (h - pad*2) * (1 - (v - min)/range)]);
  const d = pts.map((p, i) => (i === 0 ? `M${p[0].toFixed(1)},${p[1].toFixed(1)}` : `L${p[0].toFixed(1)},${p[1].toFixed(1)}`)).join(" ");
  const dArea = d + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const up = data[data.length-1] >= data[0];
  const strokeCol = color === "auto" ? (up ? "var(--up)" : "var(--down)") : color;
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      {fill && <path d={dArea} fill={strokeCol} opacity="0.08"/>}
      <path d={d} fill="none" stroke={strokeCol} strokeWidth="1.25" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="1.8" fill={strokeCol}/>
    </svg>
  );
}

function MetricCard({ label, value, unit, delta, deltaDir, asOf, source, cadence, state = "fresh", spark, note, flush = false, nextRelease }) {
  return (
    <div className={`metric ${flush ? "flush" : ""}`}>
      <div className="label">

      {delta && (
        <div className={`delta ${deltaDir || "flat"}`}>

          {deltaDir === "down" && "▼"}
          {deltaDir === "flat" && "–"}
          <span>{delta}</span>
        </div>
      )}
      {spark && <Sparkline data={spark} color={deltaDir === "up" ? "var(--up)" : deltaDir === "down" ? "var(--down)" : "var(--ink-3)"} />}
      {note && <div className="note" style={{fontSize: 12.5, lineHeight: 1.4}}>{note}</div>}

        {cadence && <Cadence kind={cadence}/>}
        {state === "stale" && <span className="pill stale">Stale</span>}
        {source && <span>{source}</span>}
        {asOf && <span>· As of {asOf}</span>}
      </div>
    </div>
  );
}

function YieldCurve() {
  const pts = [
    { t: "3M", y: 11.85 },
    { t: "6M", y: 12.05 },
    { t: "1Y", y: 12.20 },
    { t: "2Y", y: 12.40 },
    { t: "5Y", y: 12.60 },
    { t: "10Y", y: 12.92 },
  ];
  const prev = [11.76, 11.96, 12.12, 12.32, 12.52, 12.84];
  const w = 260, h = 120, pad = 24;
  const yMin = 11.5, yMax = 13.2;
  const x = i => pad + i * (w - pad*2) / (pts.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - yMin)/(yMax - yMin));
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(p.y).toFixed(1)).join(" ");
  const dPrev = prev.map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  return (
    <div className="metric flush" style={{minHeight: 160}}>
      <div className="label"><StaleDot state="fresh"/>Yield Curve · BDT Govt</div>
      <svg className="chart" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
        {[11.5, 12.0, 12.5, 13.0].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--rule-hair)"/>
            <text x={4} y={y(v)+3}>{v.toFixed(1)}</text>
          </g>
        ))}
        <path d={dPrev} fill="none" stroke="var(--ink-4)" strokeWidth="1" strokeDasharray="3 3"/>
        <path d={d} fill="none" stroke="var(--ink)" strokeWidth="1.5"/>
        {pts.map((p, i) => <g key={p.t}>
          <circle cx={x(i)} cy={y(p.y)} r="2.2" fill="var(--ink)"/>
          <text x={x(i)} y={h-6} textAnchor="middle">{p.t}</text>
        </g>)}
      </svg>
      <div className="foot">
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:14, height:1.5, background:"var(--ink)"}}/> Today</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:14, borderTop:"1px dashed var(--ink-4)"}}/> 1w ago</span>
      </div>
    </div>
  );
}

function OilEventChart() {
  const data = sparkData.brent;
  const events = [
    { i: 3, label: "IAEA report", detail: "Apr 02" },
    { i: 8, label: "OPEC+ hold", detail: "Apr 11" },
    { i: 11, label: "Hormuz tanker", detail: "Apr 21", hot: true },
  ];
  const w = 900, h = 170, pad = 34;
  const min = 80, max = 98;
  const x = i => pad + i * (w - pad*2) / (data.length - 1);
  const y = v => pad + (h - pad*2) * (1 - (v - min) / (max - min));
  const pathD = data.map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const areaD = pathD + ` L${x(data.length-1)},${h-pad} L${x(0)},${h-pad} Z`;
  return (
    <div className="metric flush" style={{minHeight: 180}}>
      <div className="label"><StaleDot state="fresh"/>Brent Spot · 12-session with event pins</div>
      <svg className="chart" width="100%" viewBox={`0 0 ${w} ${h}`} style={{overflow:"visible"}}>
        {[85, 90, 95].map(v => (
          <g key={v}>
            <line x1={pad} x2={w-pad} y1={y(v)} y2={y(v)} stroke="var(--rule-hair)"/>
            <text x={6} y={y(v)+3}>{v}</text>
          </g>
        ))}
        <path d={areaD} fill="var(--ink)" opacity="0.05"/>
        <path d={pathD} fill="none" stroke="var(--ink)" strokeWidth="1.3"/>
        {events.map(e => (
          <g key={e.label}>
            <line x1={x(e.i)} x2={x(e.i)} y1={pad} y2={h-pad} stroke={e.hot ? "var(--down)" : "var(--ink-3)"} strokeDasharray="2 3" strokeWidth="0.8"/>
            <circle cx={x(e.i)} cy={y(data[e.i])} r="3" fill={e.hot ? "var(--down)" : "var(--ink)"}/>
            <text x={x(e.i)} y={pad-8} textAnchor="middle" className="event-pin" style={{fontWeight: e.hot?600:400, fill: e.hot?"var(--down)":"var(--ink-2)"}}>{e.label}</text>
            <text x={x(e.i)} y={pad-20} textAnchor="middle" className="event-pin">{e.detail}</text>
          </g>
        ))}
        {data.map((v, i) => i % 2 === 0 && (
          <text key={i} x={x(i)} y={h-10} textAnchor="middle">{`D-${data.length-1-i}`}</text>
        ))}
      </svg>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("theBrief.tweaks") || "null");
      return { ...TWEAK_DEFAULTS, ...(saved || {}) };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });
  const [editVisible, setEditVisible] = useState(false);

  useEffect(() => {
    localStorage.setItem("theBrief.tweaks", JSON.stringify(tweaks));
  }, [tweaks]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setEditVisible(true);
      if (d.type === "__deactivate_edit_mode") setEditVisible(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(prev => {
      const next = { ...prev, [k]: v };
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
      return next;
    });
  };

  useEffect(() => {
    document.documentElement.setAttribute("data-accent", tweaks.accent);
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks.accent, tweaks.density]);

  const brP = tweaks.brPlacement;
  const layoutClass = brP === "rail" ? "layout-rail" : "";

  return (
    <div className={`page ${layoutClass}`}>
      <Masthead/>
      <ExecSignals layout={tweaks.execLayout}/>

      <Policy brPlacement={brP}/>
      <Macro brPlacement={brP}/>
      <FX brPlacement={brP}/>
      <Remittance brPlacement={brP}/>
      <DSE brPlacement={brP}/>
      <TBond brPlacement={brP}/>
      <Oil brPlacement={brP}/>
      <Headlines/>

      {brP === "bottom" && <BankerReadAggregate/>}

      <Banking/>
      <Commodities/>
      <Colophon/>

      <Tweaks tweaks={tweaks} setTweak={setTweak} visible={editVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
